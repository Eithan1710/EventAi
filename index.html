  tb.textContent = isMobile() ? String(now.getDate()) : 'היום';
  tb.setAttribute('aria-label','חזרה להיום');
  $$('#viewSeg button').forEach(b=>{ const on=b.dataset.view===S.view; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  document.title = 'Event Planner';
}
let busyCount = 0;
function setBusy(on){ busyCount = Math.max(0, busyCount + (on?1:-1)); $('#busy').classList.toggle('on', busyCount>0); }

/* ---------- view rendering ---------- */
let lastScrollKey = null;
function renderView(anim){
  const v = $('#view');
  if(anim){ v.classList.remove('anim-next','anim-prev'); void v.offsetWidth; v.classList.add(anim); }
  if(S.view==='month') renderMonth(v); else renderGrid(v, viewDays());
}

function evBlockHTML(ev, seg, nextKey, now){
  const c = evColor(ev), durMin = (seg.e - seg.s);
  const short = durMin < 45;
  const top = seg.s/60, h = Math.max(durMin, 20)/60;
  const w = 100/seg.n, x = seg.col*w;
  const cls = ['ev']; if(short) cls.push('short'); if(ev.end<=now) cls.push('past'); if(ev.pending) cls.push('pending');
  if(ev.key===nextKey) cls.push('is-next'); if(ev.key===S.flashKey) cls.push('flash');
  const tag = ev.key===nextKey ? `<span class="tag">${ev.start<=now?'עכשיו':'הבא'}</span>` : '';
  const time = `${hm(ev.start)}–${hm(ev.end)}`;
  const inner = short
    ? `<b>${tag}${esc(ev.title)}</b><small>${hm(ev.start)}</small>`
    : `<b>${tag}${esc(ev.title)}</b><small>${hm(ev.start)}<span class="end">–${hm(ev.end)}</span>${ev.location && durMin>=75 ? '<span class="loc"> · '+esc(ev.location)+'</span>' : ''}</small>`;
  return `<button type="button" class="${cls.join(' ')}" data-key="${esc(ev.key)}" style="--c:${c}; top:calc(var(--hh) * ${top}); height:calc(var(--hh) * ${h} - 2px); inset-inline-start:calc(${x}% + 2px); width:calc(${w}% - 5px);"
    aria-label="${esc(ev.title)}, ${time}">${inner}</button>`;
}
// Overlapping events share the column width (cluster → columns)
function layoutSegs(segs){
  segs.sort((a,b)=>a.s-b.s || b.e-a.e);
  let cluster=[], end=-1;
  const flush=()=>{ const cols=[]; cluster.forEach(s=>{ let i=cols.findIndex(e=>e<=s.s); if(i<0){ i=cols.length; cols.push(0); } cols[i]=s.e; s.col=i; }); cluster.forEach(s=>s.n=cols.length); cluster=[]; };
  segs.forEach(s=>{ if(cluster.length && s.s>=end){ flush(); end=-1; } cluster.push(s); end=Math.max(end,s.e); });
  flush();
  return segs;
}
const isAllDayRow = e => e.allDay || (e.end - e.start) >= DAY;

function renderGrid(v, days){
  const n = days.length, now = new Date(), t0 = todayLocal();
  const from = days[0], to = addDays(days[n-1],1);
  const evs = eventsBetween(from, to);
  const nx = nextEvent(now), nextKey = nx ? nx.key : null;
  const adEvs = evs.filter(isAllDayRow), timed = evs.filter(e=>!isAllDayRow(e));
  const single = n===1;

  // header
  let head = `<div class="gh${single?' single':''}" style="--n:${n}"><div class="gcorner">${single?'':''}</div>`;
  days.forEach(d=>{
    const today = sameDay(d,t0), past = d<t0;
    head += `<div class="gh-day${today?' today':''}${past?' past':''}" data-day="${ymd(d)}" ${single?'':'role="button" tabindex="0" title="תצוגת יום"'}>
      <span class="w">${single ? 'יום '+DAYS[d.getDay()] : DAYS_SHORT[d.getDay()]}</span><span class="n">${d.getDate()}</span>${single ? `<span class="cnt">${evs.length ? (evs.length===1?'אירוע אחד':evs.length+' אירועים') : ''}</span>` : ''}</div>`;
  });
  head += '</div>';

  // all-day row
  let ad = '';
  if(adEvs.length){
    const maxShow = single ? 6 : 3;
    ad = `<div class="allday" style="--n:${n}"><div class="lbl">כל היום</div>`;
    days.forEach(d=>{
      const de = addDays(d,1);
      const list = adEvs.filter(e=>e.start<de && e.end>d);
      ad += `<div class="cell" data-day="${ymd(d)}">` + list.slice(0,maxShow).map(e=>
        `<button type="button" class="adchip${e.key===S.flashKey?' flash':''}" data-key="${esc(e.key)}" style="--c:${evColor(e)}">${esc(e.title)}</button>`).join('')
        + (list.length>maxShow ? `<button type="button" class="mmore" data-goday="${ymd(d)}">+${list.length-maxShow} נוספים</button>` : '') + '</div>';
    });
    ad += '</div>';
  }

  // body
  let gut = '<div class="gutter">';
  for(let h=1; h<24; h++) gut += `<span style="top:calc(var(--hh) * ${h})">${pad(h)}:00</span>`;
  const todayIn = days.some(d=>sameDay(d,t0));
  if(todayIn) gut += `<span class="nowlbl" id="nowLbl" style="top:calc(var(--hh) * ${minutesOf(now)/60})">${hm(now)}</span>`;
  gut += '</div>';
  let cols = '';
  days.forEach(d=>{
    const ds = d.getTime(), de = addDays(d,1).getTime();
    const segs = timed.filter(e=>e.start<de && e.end>ds).map(e=>({ev:e,
      s: Math.max(0, (Math.max(e.start.getTime(), ds) - ds)/60000),
      e: Math.min(1440, (Math.min(e.end.getTime(), de) - ds)/60000)}));
    layoutSegs(segs);
    const today = sameDay(d,t0), wkend = d.getDay()===5 || d.getDay()===6;
    cols += `<div class="col${today?' today':''}${wkend && !today?' weekend':''}" data-day="${ymd(d)}">`
      + segs.map(sg=>evBlockHTML(sg.ev, sg, nextKey, now)).join('')
      + (todayIn ? `<div class="nowline${today?'':' faint'}" style="top:calc(var(--hh) * ${minutesOf(now)/60})"></div>` : '')
      + '<div class="slot-ghost"></div></div>';
  });
  let empty = '';
  const loadingG = S.firstLoad && gConnected() && tokenValid() && S.gState!=='ok';
  if(!evs.length && !loadingG){
    const past = to <= t0;
    const what = single ? (sameDay(days[0],t0) ? 'היום פנוי לגמרי' : past ? 'לא היו אירועים ביום הזה' : 'אין אירועים ביום הזה')
                        : (past ? 'לא היו אירועים בשבוע הזה' : 'השבוע פנוי');
    const how = past ? '' : (isMobile() ? 'הקישו על שעה ביומן כדי להוסיף אירוע' : 'לחצו על שעה ביומן (או גררו) כדי להוסיף אירוע');
    // sit in the part of the day that is on screen (the view opens around "now", or at 07:00)
    const at = days.some(d=>sameDay(d,t0)) ? Math.min(20, minutesOf(now)/60 + 1.6) : 9;
    empty = `<div class="day-empty" style="top:calc(var(--hh) * ${at})"><span class="em">${past?'🗓️':'✨'}</span><b>${what}</b><span>${how}</span></div>`;
  }
  const prevGs = $('#gs'), prevTop = prevGs ? prevGs.scrollTop : null;
  v.innerHTML = head + ad + `<div class="gs" id="gs"><div class="gb${n===7?' week7':''}" id="gb" style="--n:${n}">${gut}${cols}${empty}</div></div>`;

  // align header columns with the scrollbar, then restore / choose a scroll position
  const gs = $('#gs');
  const sbw = gs.offsetWidth - gs.clientWidth;
  v.style.setProperty('--sbw', sbw+'px');
  const key = S.view + ymd(from);
  if(key!==lastScrollKey){
    lastScrollKey = key;
    let targetMin;
    if(todayIn) targetMin = minutesOf(now) - 120;
    else { const first = timed.map(e=>sameDay(e.start,from)||e.start>from ? minutesOf(e.start) : 0).sort((a,b)=>a-b)[0]; targetMin = first!=null ? first - 60 : 7*60; }
    gs.scrollTop = Math.max(0, targetMin/60*hhPx());
  } else if(S._keepScroll!=null){ gs.scrollTop = S._keepScroll; }
  else if(prevTop!=null){ gs.scrollTop = prevTop; }
  bindGrid();
}

function renderMonth(v){
  const d = S.date, start = monthGridStart(d), rows = monthRows(d), t0 = todayLocal(), now = new Date();
  const end = addDays(start, rows*7);
  const evs = eventsBetween(start, end);
  const cellH = Math.max(60, ((v.clientHeight || 600) - 36) / rows);
  const maxChips = Math.max(1, Math.floor((cellH - (isMobile()?30:36)) / (isMobile()?17:21)));
  let html = `<div class="month" style="--rows:${rows}"><div class="m-wd">${DAYS.map((x,i)=>`<span>${isMobile()?DAYS_SHORT[i]:x}</span>`).join('')}</div>`;
  for(let r=0; r<rows; r++){
    html += '<div class="m-row">';
    for(let c=0; c<7; c++){
      const day = addDays(start, r*7+c), de = addDays(day,1);
      const list = evs.filter(e=>e.start<de && e.end>day).sort((a,b)=>(isAllDayRow(b)-isAllDayRow(a)) || a.start-b.start);
      const out = day.getMonth()!==d.getMonth(), today = sameDay(day,t0);
      const fits = list.length>maxChips ? maxChips-1 : maxChips;
      html += `<div class="mcell${out?' out':''}${today?' today':''}" data-day="${ymd(day)}"><button type="button" class="mnum" data-goday="${ymd(day)}" aria-label="${longDate(day)}">${day.getDate()}</button>`
        + list.slice(0,fits).map(e=>{
          const ad = isAllDayRow(e);
          return `<button type="button" class="mchip${ad?' ad':''}${e.end<=now?' past':''}${e.key===S.flashKey?' flash':''}" data-key="${esc(e.key)}" style="--c:${evColor(e)}"><i></i>${ad?'':`<small>${hm(e.start)}</small>`}<b>${esc(e.title)}</b></button>`;
        }).join('')
        + (list.length>fits ? `<button type="button" class="mmore" data-goday="${ymd(day)}">+${list.length-fits}${isMobile()?'':' נוספים'}</button>` : '')
        + '</div>';
    }
    html += '</div>';
  }
  v.innerHTML = html + '</div>';
}

/* ---------- live "now": the red line, countdowns, day rollover ---------- */
let lastDay = ymd(new Date());
function tick(){
  const now = new Date();
  if(ymd(now)!==lastDay){           // midnight passed
    const wasToday = ymd(S.date)===lastDay;
    lastDay = ymd(now);
    if(wasToday) S.date = todayLocal();
    renderAll(); return;
  }
  const top = `calc(var(--hh) * ${minutesOf(now)/60})`;
  $$('.nowline').forEach(l=>l.style.top = top);
  const lbl = $('#nowLbl'); if(lbl){ lbl.style.top = top; lbl.textContent = hm(now); }
  renderUpcoming(); renderNextBar(); renderGreet();
  // "next" highlight moves on when an event ends
  const nx = nextEvent(now), cur = $('.ev.is-next');
  if((nx && (!cur || cur.dataset.key!==nx.key)) || (!nx && cur)) { S._keepScroll = $('#gs') ? $('#gs').scrollTop : null; renderView(); S._keepScroll = null; }
}

/* ---------- sidebar ---------- */
function renderGreet(){
  const h = new Date().getHours();
  const g = h<5 ? 'לילה טוב' : h<12 ? 'בוקר טוב' : h<17 ? 'צהריים טובים' : h<22 ? 'ערב טוב' : 'לילה טוב';
  const t0 = todayLocal(), todays = eventsBetween(t0, addDays(t0,1)).filter(e=>!e.pending);
  const left = todays.filter(e=>e.end>new Date());
  let sub;
  if(!todays.length) sub = `${longDate(t0)} · אין אירועים היום`;
  else if(!left.length) sub = `${longDate(t0)} · סיימת את היום 🎉`;
  else sub = `${longDate(t0)} · ${left.length===1?'עוד אירוע אחד':'עוד '+left.length+' אירועים'} היום`;
  $('#greet').innerHTML = `<b>${g}</b><span>${sub}</span>`;
}
let miniMonth = null;
function renderMini(){
  const m = miniMonth || new Date(S.date.getFullYear(), S.date.getMonth(), 1);
  const start = monthGridStart(m), rows = monthRows(m), t0 = todayLocal();
  const [rs, re] = viewRange();
  const has = new Set();
  eventsBetween(start, addDays(start, rows*7)).forEach(e=>{ for(let x=sod(e.start); x<e.end && x<addDays(start,rows*7); x=addDays(x,1)) has.add(ymd(x)); });
  let g = DAYS_SHORT.map(x=>`<span class="wd">${x}</span>`).join('');
  for(let i=0;i<rows*7;i++){
    const d = addDays(start,i), cls=[];
    if(d.getMonth()!==m.getMonth()) cls.push('out');
    if(sameDay(d,t0)) cls.push('today');
    if(S.view==='day' ? sameDay(d,S.date) : false) cls.push('sel');
    if(S.view==='week' && d>=rs && d<re && !sameDay(d,t0)) cls.push('inrange');
    if(has.has(ymd(d))) cls.push('has');
    g += `<button type="button" class="${cls.join(' ')}" data-mini="${ymd(d)}" aria-label="${longDate(d)}"><span>${d.getDate()}</span></button>`;
  }
  $('#mini').innerHTML = `<div class="mini-head"><b>${MONTHS[m.getMonth()]} ${m.getFullYear()}</b><div class="mini-nav">
    <button type="button" data-mininav="-1" aria-label="חודש קודם">${ICON.chevR}</button><button type="button" data-mininav="1" aria-label="חודש הבא">${ICON.chevL}</button></div></div>
    <div class="mini-grid">${g}</div>`;
}
function renderUpcoming(){
  const now = new Date(), t0 = todayLocal();

  else if(!rest.length){

      html += `<button type="button" class="up-item" data-key="${esc(e.key)}" style="--c:${evColor(e)}"><span class="bar"></span><span class="tx"><b>${esc(e.title)}</b><small>${e.allDay?'כל היום':hm(e.start)+' – '+hm(e.end)}${e.location?' · '+esc(e.location):''}</small></span></button>`;
    });

  box.innerHTML = html;
}
function renderFilters(){

      + cals.map(c=>`<button type="button" class="fitem${S.hiddenCals.has(c.id)?' off':''}" data-cal="${esc(c.id)}" style="--c:${c.color}" aria-pressed="${!S.hiddenCals.has(c.id)}"><span class="fbox">${ICON.check}</span><span class="fl">${esc(c.summary)}</span></button>`).join('')

      + cats.map(c=>`<button type="button" class="catchip${S.hiddenCats.has(c.k)?' off':''}" data-cat="${c.k}" style="--c:${c.c}" aria-pressed="${!S.hiddenCats.has(c.k)}"><i></i>${esc(c.l)}</button>`).join('') + '</div>';

  $('#filters').innerHTML = html;
}
function ago(ts){ const m = Math.round((Date.now()-ts)/60000); return m<1 ? 'עכשיו' : m===1 ? 'לפני דקה' : m<60 ? `לפני ${m} דק׳` : 'לפני יותר משעה'; }
function renderConn(){
  const box = $('#gconn');
  let t, s, btn;
  if(!getClientId()){ t='Google Calendar'; s='האירועים נשמרים במכשיר הזה'; btn=`<button type="button" class="gbtn" data-act="settings">חיבור</button>`; }
  else if(!gConnected()){ t='Google Calendar'; s='לא מחובר'; btn=`<button type="button" class="gbtn" data-act="connect">התחברות</button>`; }
  else if(S.gState==='expired' || !tokenValid()){ t='Google Calendar'; s='<span class="dot warn"></span>צריך להתחבר שוב'; btn=`<button type="button" class="gbtn" data-act="connect">התחברות</button>`; }
  else if(S.gState==='syncing'){ t='Google Calendar'; s='מסנכרן…'; btn=`<button type="button" class="ic" disabled aria-label="מסנכרן"><span class="spin" style="display:grid">${ICON.refresh}</span></button>`; }
  else if(S.gState==='error'){ t='Google Calendar'; s='<span class="dot warn"></span>הסנכרון נכשל'; btn=`<button type="button" class="gbtn" data-act="sync">נסה שוב</button>`; }
  else { t='Google Calendar'; s=`<span class="dot"></span>מחובר · ${S.gSyncedAt?ago(S.gSyncedAt):''}`; btn=`<button type="button" class="ic" data-act="sync" aria-label="סנכרון עכשיו" title="סנכרון עכשיו">${ICON.refresh}</button>`; }
  // on phones the sidebar is hidden: a small dot on the menu button says "Google needs you" (no popups, no banners)
  $('#menuBtn').classList.toggle('warn', !!getClientId() && gConnected() && (S.gState==='expired' || S.gState==='error' || !tokenValid()));
  box.innerHTML = `<span class="gi">${ICON.google}</span><span class="gt"><b>${t}</b><span>${s}</span></span>${btn}<button type="button" class="ic" data-act="settings" aria-label="הגדרות" title="הגדרות"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>`;
}
function renderSide(){ renderGreet(); renderMini(); renderUpcoming(); renderFilters(); renderConn(); }
function renderNextBar(){
  const b = $('#nextBar'), nx = nextEvent();
  if(!nx || S.view==='month'){ b.classList.add('hide'); return; }
  const now = new Date();
  b.classList.remove('hide'); b.dataset.key = nx.key; b.style.setProperty('--c', evColor(nx));
  b.innerHTML = `<i></i><b>${nx.start<=now?'עכשיו':'הבא'}: ${esc(nx.title)}</b><span>${countdown(nx, now)}</span>`;

function renderAll(anim){ renderTop(); renderView(anim); renderSide(); renderNextBar(); }

/* ---------- navigation ---------- */
function go(delta){
  if(S.view==='day') S.date = addDays(S.date, delta);
  else if(S.view==='week') S.date = addDays(S.date, 7*delta);
  else S.date = new Date(S.date.getFullYear(), S.date.getMonth()+delta, 1);
  miniMonth = null;
  renderAll(delta>0?'anim-next':'anim-prev');
  syncGoogle();
}
function goToday(){ const t=todayLocal(); const dir = t>S.date?'anim-next':t<S.date?'anim-prev':null; S.date = t; miniMonth=null; lastScrollKey=null; renderAll(dir); syncGoogle(); }
function setView(v){ if(!['day','week','month'].includes(v)) return; S.view = v; LS.rawSet('ep_view', v); lastScrollKey=null; renderAll(); syncGoogle(); }
function goToDate(d, view){ S.date = sod(d); if(view) { S.view = view; LS.rawSet('ep_view', view); } miniMonth=null; lastScrollKey=null; renderAll(); syncGoogle(); }
// jump to an event: date, time and a short highlight
function revealEvent(ev){
  if(S.hiddenCals.has(ev.calId)){ S.hiddenCals.delete(ev.calId); LS.set('ep_hidden_cals',[...S.hiddenCals]); }
  if(S.hiddenCats.has(ev.cat)){ S.hiddenCats.delete(ev.cat); LS.set('ep_hidden_cats',[...S.hiddenCats]); }
  S.flashKey = ev.key;
  const view = S.view==='month' ? 'month' : (isMobile() ? 'day' : S.view);
  goToDate(ev.start, view);
  const gs = $('#gs');
  if(gs && !isAllDayRow(ev)) gs.scrollTo({top: Math.max(0, (minutesOf(ev.start)/60 - 1.5) * hhPx()), behavior:'smooth'});
  setTimeout(()=>{ if(S.flashKey===ev.key) S.flashKey=null; }, 1600);
}

/* =====================================================================
   Interactions on the calendar
   ===================================================================== */
function findEvent(key){ return allEvents().find(e=>e.key===key); }
function slotFromY(col, clientY, snap){
  const r = col.getBoundingClientRect();
  const min = Math.max(0, Math.min(1439, (clientY - r.top) / hhPx() * 60));
  return Math.floor(min / snap) * snap;
}
function fmtMin(m){ return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`; }
function dateAtMin(dayStr, min){ const d = parseYMD(dayStr); d.setMinutes(min); return d; }

let drag = null, lastPointer = 'mouse';
function bindGrid(){
  const gb = $('#gb'); if(!gb) return;
  gb.addEventListener('pointerdown', e=>{
    lastPointer = e.pointerType;
    const col = e.target.closest('.col');
    if(!col || e.target.closest('.ev') || e.button!==0 || e.pointerType!=='mouse') return;
    const s = slotFromY(col, e.clientY, 30);
    drag = {col, day:col.dataset.day, s0:s, s:s, e:s+60, y0:e.clientY, moved:false};
    col.setPointerCapture(e.pointerId);
    showGhost(col, drag.s, drag.e, true);
    e.preventDefault();
  });
  gb.addEventListener('pointermove', e=>{
    const col = e.target.closest('.col');
    if(drag){
      if(Math.abs(e.clientY - drag.y0) > 6) drag.moved = true;
      if(!drag.moved) return;
      const m = slotFromY(drag.col, e.clientY, 15);
      drag.s = Math.min(drag.s0, m); drag.e = Math.max(drag.s0 + 15, m + 15);
      showGhost(drag.col, drag.s, drag.e, true);
      return;
    }
    if(e.pointerType!=='mouse') return;
    $$('.slot-ghost.show').forEach(g=>{ if(!col || g.parentNode!==col) g.classList.remove('show'); });
    if(!col || e.target.closest('.ev')) { if(col) col.querySelector('.slot-ghost').classList.remove('show'); return; }
    const s = slotFromY(col, e.clientY, 30);
    showGhost(col, s, s+60, false);
  });
  gb.addEventListener('pointerup', e=>{
    if(!drag) return;
    const d = drag; drag = null;
    const s = d.moved ? d.s : d.s0, en = d.moved ? d.e : d.s0 + 60;
    openForm({start: dateAtMin(d.day, s), end: dateAtMin(d.day, en)});
  });
  gb.addEventListener('pointerleave', ()=>{ if(!drag) $$('.slot-ghost.show').forEach(g=>g.classList.remove('show')); });
  // touch / pen: a tap on an empty slot creates an event there
  gb.addEventListener('click', e=>{
    const ev = e.target.closest('.ev');
    if(ev){ openDetails(ev.dataset.key); return; }
    if(lastPointer==='mouse') return;
    const col = e.target.closest('.col'); if(!col) return;
    const s = slotFromY(col, e.clientY, 30);
    showGhost(col, s, s+60, true);
    setTimeout(()=>openForm({start: dateAtMin(col.dataset.day, s), end: dateAtMin(col.dataset.day, s+60)}), 90);
  });
}
function showGhost(col, s, e, sel){
  const g = col.querySelector('.slot-ghost'); if(!g) return;
  g.style.top = `calc(var(--hh) * ${s/60})`; g.style.height = `calc(var(--hh) * ${(e-s)/60} - 2px)`;
  g.textContent = sel ? `${fmtMin(s)} – ${fmtMin(e)}` : `+ ${fmtMin(s)}`;
  g.classList.add('show'); g.classList.toggle('sel', !!sel);
}

// everything else on the page (header days, month cells, chips, sidebar)
document.addEventListener('click', e=>{
  const t = e.target;
  let el;
  if((el = t.closest('[data-key]')) && !t.closest('#gb') && !t.closest('#searchPanel')){ openDetails(el.dataset.key); closeSide(); return; }
  if((el = t.closest('[data-goday]'))){ goToDate(parseYMD(el.dataset.goday), 'day'); return; }
  if((el = t.closest('.gh-day')) && !t.closest('.gh.single')){ goToDate(parseYMD(el.dataset.day), 'day'); return; }
  if((el = t.closest('.allday .cell'))){ const d=parseYMD(el.dataset.day); openForm({start:d, end:addDays(d,1), allDay:true}); return; }
  if((el = t.closest('.mcell'))){
    const d = parseYMD(el.dataset.day);
    if(isMobile()){ goToDate(d, 'day'); return; }
    const now = new Date(), s = new Date(d);
    if(sameDay(d, now)) s.setHours(Math.min(23, now.getHours()+1), 0, 0, 0); else s.setHours(10,0,0,0);
    openForm({start:s, end:new Date(s.getTime()+3600e3)}); return;
  }
  if((el = t.closest('[data-mini]'))){ goToDate(parseYMD(el.dataset.mini)); closeSide(); return; }
  if((el = t.closest('[data-mininav]'))){ const m = miniMonth || new Date(S.date.getFullYear(), S.date.getMonth(), 1); miniMonth = addMonths(m, +el.dataset.mininav); renderMini(); return; }
  if((el = t.closest('[data-cal]'))){ toggleSet(S.hiddenCals, el.dataset.cal, 'ep_hidden_cals'); return; }
  if((el = t.closest('[data-cat]')) && t.closest('#filters')){ toggleSet(S.hiddenCats, el.dataset.cat, 'ep_hidden_cats'); return; }
  if((el = t.closest('[data-act]'))){
    const a = el.dataset.act;
    if(a==='new'){ closeSide(); openForm({}); }
    else if(a==='settings'){ closeSide(); openSettings(); }
    else if(a==='connect') connectGoogle();
    else if(a==='sync') syncGoogle(true);
    else if(a==='showall'){ S.hiddenCals.clear(); S.hiddenCats.clear(); LS.set('ep_hidden_cals',[]); LS.set('ep_hidden_cats',[]); renderAll(); }
    return;
  }
});
function toggleSet(set, v, key){ set.has(v) ? set.delete(v) : set.add(v); LS.set(key, [...set]); renderView(); renderSide(); renderNextBar(); }
document.addEventListener('keydown', e=>{

      <div class="f-grid">
        ${ICON.clock}
        <div class="f-line" id="fWhen"></div>
        <span></span>
        <div class="f-line"><label class="toggle"><input type="checkbox" id="fAllDay"${F.allDay?' checked':''}>כל היום</label></div>
        ${ICON.tag}
        <div class="catrow" id="fCats" role="radiogroup" aria-label="סוג אירוע">${CATS.map(c=>`<button type="button" class="catopt${c.k===F.cat?' on':''}" data-fcat="${c.k}" style="--c:${c.c}" role="radio" aria-checked="${c.k===F.cat}">${c.e} ${esc(c.l)}</button>`).join('')}</div>
        ${calSel}
        <div class="f-more${hasMore?' show':''}" id="fMore">

          ${ICON.note}<div class="f-line"><textarea class="inp wide" id="fNotes" rows="2" placeholder="הערות" aria-label="הערות">${ev?esc(ev.notes):''}</textarea></div>
        </div>
      </div>
      ${hasMore ? '' : '<button type="button" class="more-btn" id="fMoreBtn">+ מיקום והערות</button>'}
      <div class="f-err" id="fErr" role="alert"></div>

        <span class="hint">Enter לשמירה · Esc לסגירה</span>
        <button type="button" class="btn plain" data-close>ביטול</button>
        <button type="submit" class="btn primary" id="fSave">${ev?'שמירה':'יצירת אירוע'}</button>

  renderWhen();

    if(F.allDay){ F.start = sod(F.start); F.end = addDays(sod(new Date(F.end.getTime()-1)),1); if(F.end<=F.start) F.end=addDays(F.start,1); }
    else { const s=new Date(F.start); s.setHours(10,0,0,0); F.start=s; F.end=new Date(s.getTime()+3600e3); }
    F.manualTime = true; renderWhen();
  });
  $('#fCats').addEventListener('click', e=>{
    const b = e.target.closest('[data-fcat]'); if(!b) return;

  $('#fCal') && $('#fCal').addEventListener('change', e=>{ F.calId = e.target.value; });

  $('#fEx') && $('#fEx').addEventListener('click', e=>{ const b=e.target.closest('[data-ex]'); if(!b) return; title.value=b.dataset.ex; onTitleInput(); title.focus(); });
  $('#fLoc').addEventListener('input', ()=>{ F.locTouched = true; });

function paintCats(){
  $$('#fCats .catopt').forEach(b=>{ const on=b.dataset.fcat===F.cat; b.classList.toggle('on',on); b.setAttribute('aria-checked',on); });
  const on = $('#fCats .catopt.on');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'nearest'});
}
function renderWhen(){
  const w = $('#fWhen');
  if(F.allDay){
    const last = addDays(F.end,-1);
    w.innerHTML = `<input class="inp date" type="date" id="fD1" value="${ymd(F.start)}" aria-label="מתאריך"><span class="f-sep">–</span><input class="inp date" type="date" id="fD2" value="${ymd(last)}" aria-label="עד תאריך">`;
    $('#fD1').addEventListener('change', e=>{ if(!e.target.value) return; const len=F.end-F.start; F.start=parseYMD(e.target.value); F.end=new Date(F.start.getTime()+len); F.manualDate=true; renderWhen(); });
    $('#fD2').addEventListener('change', e=>{ if(!e.target.value) return; let d=addDays(parseYMD(e.target.value),1); if(d<=F.start) d=addDays(F.start,1); F.end=d; F.manualDate=true; renderWhen(); });
  } else {
    const multi = !sameDay(F.start, new Date(F.end.getTime()-1));
    const overnight = multi && (F.end - F.start) < DAY;
    w.innerHTML = `<input class="inp date" type="date" id="fDate" value="${ymd(F.start)}" aria-label="תאריך">
      <input class="inp time" type="time" id="fStart" value="${hm(F.start)}" step="300" aria-label="שעת התחלה"><span class="f-sep">–</span>
      <input class="inp time" type="time" id="fEnd" value="${hm(F.end)}" step="300" aria-label="שעת סיום">
      ${multi && !overnight ? `<input class="inp date" type="date" id="fEndDate" value="${ymd(F.end)}" aria-label="תאריך סיום">` : ''}
      ${overnight ? '<span class="qchip">⤴ מסתיים למחרת</span>' : ''}`;
    $('#fDate').addEventListener('change', e=>{ if(!e.target.value) return; const len=F.end-F.start, d=parseYMD(e.target.value); d.setHours(F.start.getHours(), F.start.getMinutes()); F.start=d; F.end=new Date(d.getTime()+len); F.manualDate=true; renderWhen(); });
    $('#fStart').addEventListener('change', e=>{ if(!e.target.value) return; const len=F.end-F.start, [h,m]=e.target.value.split(':').map(Number); const d=new Date(F.start); d.setHours(h,m,0,0); F.start=d; F.end=new Date(d.getTime()+len); F.manualTime=true; renderWhen(); });
    $('#fEnd').addEventListener('change', e=>{ if(!e.target.value) return; const [h,m]=e.target.value.split(':').map(Number); let d=new Date(F.start); if(!sameDay(F.start,F.end) && (F.end-F.start)>=DAY) d=new Date(F.end); d.setHours(h,m,0,0); if(d<=F.start) d=addDays(d,1); F.end=d; F.manualTime=true; renderWhen(); });
    $('#fEndDate') && $('#fEndDate').addEventListener('change', e=>{ if(!e.target.value) return; const d=parseYMD(e.target.value); d.setHours(F.end.getHours(),F.end.getMinutes()); if(d>F.start) F.end=d; F.manualDate=true; renderWhen(); });
  }
}
// Live understanding of the title: "חדר כושר מחר 18:00" fills date, time and type as you type
function onTitleInput(){
  if(!F || F.mode!=='create') return;
  const raw = $('#fTitle').value;
  const ex = $('#fEx'); if(ex) ex.style.display = raw.trim() ? 'none' : '';
  const manual = F.manualDate || F.manualTime;
  const b = manual ? {start:F.start, end:F.end, allDay:F.allDay} : F.base;
  let s = new Date(b.start), e = new Date(b.end), allDay = b.allDay;
  const chips = [];
  const p = raw.trim() ? parseEvent(raw, {date: sod(s), h:s.getHours(), m:s.getMinutes(), dur: Math.max(15,(e-s)/60000)}) : null;
  F.parsed = p;
  if(p){
    if(p.allDay && !manual){ allDay = true; s = p.start; e = p.end; chips.push(`📅 ${longDate(p.start)} – ${longDate(addDays(p.end,-1))}`); }
    else {
      if(p.dateFound && !F.manualDate){
        const len = e - s, d = sod(p.start); d.setHours(s.getHours(), s.getMinutes()); s = d; e = new Date(d.getTime()+len);
        chips.push(`📅 ${dayLabel(p.start)}${Math.abs(sod(p.start)-todayLocal())>=2*DAY?' '+p.start.getDate()+'/'+(p.start.getMonth()+1):''}`);
      }
      if(p.timeFound && !F.manualTime){
        const len = p.end - p.start; s = new Date(s); s.setHours(p.start.getHours(), p.start.getMinutes(), 0, 0); e = new Date(s.getTime()+len);
        if(allDay){ allDay = false; }
        chips.push(`🕐 ${hm(s)}${p.overnight ? ' – '+hm(e)+' (למחרת)' : (len!==3600e3 ? ' – '+hm(e) : '')}`);
      }
    }
    if(p.catFound && !F.catTouched){ F.cat = p.cat; chips.push(`${catObj(p.cat).e} ${catObj(p.cat).l}`); }
    else if(!F.catTouched) F.cat = 'other';
    if(p.location && !F.locTouched){ $('#fMore').classList.add('show'); const mb=$('#fMoreBtn'); if(mb) mb.remove(); $('#fLoc').value = p.location; chips.push(`📍 ${esc(p.location)}`); }
  } else if(!F.catTouched) F.cat = 'other';
  paintCats();
  if(s.getTime()!==F.start.getTime() || e.getTime()!==F.end.getTime() || allDay!==F.allDay){
    F.start = s; F.end = e; F.allDay = allDay; $('#fAllDay').checked = allDay; renderWhen();
  }
  $('#fParse').innerHTML = chips.length ? chips.map(c=>`<span class="qchip">${c}</span>`).join('') + '<span class="qchip dim">הבנו מהטקסט ✓</span>' : '';
}
function collectForm(){
  const raw = $('#fTitle').value.trim();
  let title = raw;
  // in "create", strip the date/time words we understood: "Gym tomorrow 18:00" → "Gym"
  if(F.mode==='create' && F.parsed && F.parsed.title && (F.parsed.dateFound || F.parsed.timeFound || F.parsed.location || F.parsed.allDay)) title = F.parsed.title;
  let start = new Date(F.start), end = new Date(F.end);
  if(!F.allDay && end<=start) end = addDays(end,1);
  if(F.allDay){ start = sod(start); end = sod(end); if(end<=start) end = addDays(start,1); }
  return {title: title || 'אירוע חדש', start, end, allDay: F.allDay, cat: F.cat,
    location: ($('#fLoc').value||'').trim(), notes: ($('#fNotes').value||'').trim(), calId: F.calId};
}
function saveForm(){
  if(!F) return;
  const d = collectForm();
  const needG = d.calId!=='local' || (F.ev && F.ev.src==='google');
  const tokP = needG && !tokenValid() ? ensureToken() : null;       // inside the click: popup allowed
  const btn = $('#fSave'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const mode = F.mode, old = F.ev;
  LS.rawSet('ep_last_cal', d.calId);
  const p = mode==='edit' ? updateEvent(old, d, tokP) : createEvent(d, tokP);
  // local saves are instant; Google ones show a pending block right away
  if(mode==='create' && d.calId!=='local'){ closeModal(); afterSave(d, null); }
  p.then(ev=>{ if(modalType==='form') closeModal(); afterSave(d, ev); })
   .catch(err=>{
      renderAll();
      if(modalType==='form'){ btn.disabled=false; btn.textContent = mode==='edit'?'שמירה':'יצירת אירוע'; }
      handleErr(err, 'לא הצלחנו לשמור ל-Google Calendar. נסו שוב', d);
   });
}
function afterSave(d, ev){
  const [rs,re] = viewRange();
  if(ev) S.flashKey = ev.key;
  if(d.start<rs || d.start>=re) goToDate(d.start); else { S._keepScroll = $('#gs')?$('#gs').scrollTop:null; renderAll(); S._keepScroll=null; }
  if(ev) setTimeout(()=>{ if(S.flashKey===ev.key) S.flashKey=null; }, 1600);
}
function handleErr(err, msg, draft){
  if(err && err.code==='no-client-id'){ openSettings(); return; }
  if(err && (err.code==='gis-not-ready')){ toast('Google עדיין נטען, נסו שוב בעוד רגע', 'err'); return; }
  if(err && (err.type==='popup_closed' || err.type==='popup_failed_to_open' || err.error==='access_denied')){ toast('ההתחברות ל-Google בוטלה', 'err'); return; }
  if(err && err.code==='expired'){ S.gState='expired'; renderConn(); }
  if(draft && modalType!=='form') toast(msg, 'err', 'לשמור במכשיר', ()=>{ createEvent({...draft, calId:'local'}).then(ev=>afterSave(draft, ev)); });
  else toast(msg, 'err');
}

function connectGoogle(){
  if(!getClientId()){ openSettings(); return; }
  S.gState = 'connecting'; renderConn();
  ensureToken(!gConnected()).then(()=>{ S.gCals=[]; return syncGoogle(true); })
    .catch(err=>{ S.gState = gConnected() ? 'expired' : 'off'; renderConn(); handleErr(err, 'לא הצלחנו להתחבר ל-Google'); });
}

/* ---------- toasts: short, only when they add something ---------- */
function toast(msg, kind, actionLabel, action, action2Label, action2){
  const box = $('#toasts');
  while(box.children.length>=2) box.firstChild.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='err'?' err':'');
  t.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel?`<button type="button" data-a="1">${esc(actionLabel)}</button>`:'') + (action2Label?`<button type="button" data-a="2">${esc(action2Label)}</button>`:'');
  const kill = ()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 200); };
  t.addEventListener('click', e=>{ const b=e.target.closest('[data-a]'); if(!b) return; (b.dataset.a==='1'?action:action2)(); kill(); });
  box.appendChild(t);
  setTimeout(kill, actionLabel ? 6000 : 2800);
}

/* =====================================================================
   Quick add (sidebar): type → Enter → it's on the calendar
   ===================================================================== */
function quickPreview(){
  const v = $('#quickInput').value.trim(), box = $('#quickPreview');
  if(!v){ box.classList.remove('show'); box.innerHTML=''; return; }
  const p = parseEvent(v);
  const cat = catObj(p.cat);
  box.innerHTML = [
    `<span class="qchip">${cat.e} ${esc(p.title||'אירוע חדש')}</span>`,
    `<span class="qchip">📅 ${p.allDay ? longDate(p.start)+' – '+longDate(addDays(p.end,-1)) : dayLabel(p.start)+(Math.abs(sod(p.start)-todayLocal())>=2*DAY?' '+p.start.getDate()+'/'+(p.start.getMonth()+1):'')}</span>`,
    p.allDay ? '' : `<span class="qchip${p.timeFound?'':' dim'}">🕐 ${hm(p.start)}${p.overnight?'–'+hm(p.end):''}</span>`,
    p.location ? `<span class="qchip">📍 ${esc(p.location)}</span>` : ''
  ].join('');
  box.classList.add('show');
}
$('#quickInput').addEventListener('input', quickPreview);
$('#quickForm').addEventListener('submit', e=>{
  e.preventDefault();
  const inp = $('#quickInput'), v = inp.value.trim(); if(!v) return;
  const p = parseEvent(v);
  const d = {title: p.title || 'אירוע חדש', start:p.start, end:p.end, allDay:!!p.allDay, cat:p.cat, location:p.location, notes:'', calId: defaultCal()};
  const tokP = d.calId!=='local' && !tokenValid() ? ensureToken() : null;
  inp.value = ''; quickPreview(); inp.blur(); closeSide();
  const when = d.allDay ? longDate(d.start) : `${dayLabel(d.start)} ${hm(d.start)}`;
  const pr = createEvent(d, tokP);
  afterSave(d, null);
  pr.then(ev=>{
    afterSave(d, ev);
    toast(`נוסף: ${d.title} · ${when}`, null, 'עריכה', ()=>openForm({ev: findEvent(ev.key)||ev}), 'ביטול', ()=>{ deleteEvent(ev).then(()=>renderAll()).catch(()=>{}); });
  }).catch(err=>{ renderAll(); inp.value = v; quickPreview(); handleErr(err, 'לא הצלחנו להוסיף ל-Google Calendar', d); });
});

/* =====================================================================
   Search
   ===================================================================== */
let sTimer = null, sSeq = 0, sResults = [], sAct = -1;
const norm = s => (s||'').toLowerCase().replace(/[֑-ׇ]/g,'');
function hl(text, q){
  const i = norm(text).indexOf(norm(q));
  if(!q || i<0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}
function localSearch(q){
  const n = norm(q);
  return allEvents().filter(e=>!e.pending && (norm(e.title).includes(n) || norm(e.location).includes(n) || norm(e.notes).includes(n)));
}
function paintSearch(q, loading){
  const now = new Date();
  const seen = new Set(); sResults = sResults.filter(e=>!seen.has(e.key) && seen.add(e.key));
  const up = sResults.filter(e=>e.end>now).sort((a,b)=>a.start-b.start);
  const past = sResults.filter(e=>e.end<=now).sort((a,b)=>b.start-a.start);
  const ordered = [...up, ...past].slice(0,40);
  const item = (e,i)=>`<button type="button" class="s-item${i===sAct?' act':''}" data-si="${i}" role="option" style="--c:${evColor(e)}">
      <span class="s-date"><b>${e.start.getDate()}</b><small>${MONTHS_SHORT[e.start.getMonth()]}${e.start.getFullYear()!==now.getFullYear()?' '+String(e.start.getFullYear()).slice(2):''}</small></span>
      <span class="tx"><b>${hl(e.title,q)}</b><small>${dayLabel(e.start)} · ${e.allDay?'כל היום':hm(e.start)}${e.location?' · '+hl(e.location,q):''}</small></span><i class="dot"></i></button>`;
  let html = '', idx = 0;
  const upIn = ordered.filter(e=>e.end>now), pastIn = ordered.filter(e=>e.end<=now);
  if(upIn.length) html += '<div class="s-sec">קרובים</div>' + upIn.map(e=>item(e, idx++)).join('');
  if(pastIn.length) html += '<div class="s-sec">עברו</div>' + pastIn.map(e=>item(e, idx++)).join('');
  if(!ordered.length && !loading) html = `<div class="s-empty">לא נמצאו אירועים עבור ״${esc(q)}״</div>`;
  if(loading) html += `<div class="s-more"><span class="spin" style="display:inline-grid">${ICON.refresh}</span>מחפש גם ב-Google Calendar…</div>`;
  sResults = ordered;
  const p = $('#searchPanel'); p.innerHTML = html; p.classList.add('show');
}
function runSearch(){
  const q = $('#searchInput').value.trim();
  const seq = ++sSeq; sAct = -1;
  if(!q){ $('#searchPanel').classList.remove('show'); sResults=[]; return; }
  sResults = localSearch(q);
  const g = gConnected() && tokenValid() && S.gCals.length;
  paintSearch(q, g);
  if(!g) return;
  const t0 = todayLocal();
  Promise.all(S.gCals.filter(c=>!S.hiddenCals.has(c.id)).map(c=>gListEvents(c, addDays(t0,-365), addDays(t0,365), q).catch(()=>[])))
    .then(lists=>{ if(seq!==sSeq) return; sResults = sResults.concat(lists.flat()); paintSearch(q, false); });
}
function pickResult(i){
  const ev = sResults[i]; if(!ev) return;
  if(!findEvent(ev.key) && ev.src==='google') S.gEvents.push(ev);   // found only by the search: keep it so it can be shown
  closeSearch(true);
  revealEvent(ev);
}
function closeSearch(clear){
  $('#searchPanel').classList.remove('show');
  if(clear){ $('#searchInput').value=''; sResults=[]; }
  if(!$('#searchInput').value) $('#searchWrap').classList.remove('open');
  $('#searchInput').blur();
}
$('#searchInput').addEventListener('input', ()=>{ clearTimeout(sTimer); sTimer = setTimeout(runSearch, 180); });
$('#searchInput').addEventListener('focus', ()=>{ $('#searchWrap').classList.add('open'); if($('#searchInput').value.trim()) runSearch(); });
$('#searchInput').addEventListener('keydown', e=>{
  const n = $$('#searchPanel .s-item').length;
  if(e.key==='ArrowDown'){ e.preventDefault(); sAct = Math.min(n-1, sAct+1); paintAct(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sAct = Math.max(0, sAct-1); paintAct(); }
  else if(e.key==='Enter'){ e.preventDefault(); pickResult(sAct<0?0:sAct); }
  else if(e.key==='Escape'){ e.preventDefault(); closeSearch(true); }
});
function paintAct(){ $$('#searchPanel .s-item').forEach((b,i)=>{ b.classList.toggle('act', i===sAct); if(i===sAct) b.scrollIntoView({block:'nearest'}); }); }
$('#searchPanel').addEventListener('mousedown', e=>e.preventDefault());
$('#searchPanel').addEventListener('click', e=>{ const b=e.target.closest('[data-si]'); if(b) pickResult(+b.dataset.si); });
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('#searchWrap')) { $('#searchPanel').classList.remove('show'); if(!$('#searchInput').value) $('#searchWrap').classList.remove('open'); } });

/* =====================================================================
   Top bar, sidebar drawer, keyboard, swipe
   ===================================================================== */
$('#prevBtn').addEventListener('click', ()=>go(-1));
$('#nextBtn').addEventListener('click', ()=>go(1));
$('#todayBtn').addEventListener('click', goToday);
$('#viewSeg').addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });
$('#settingsBtn').addEventListener('click', openSettings);
$('#createBtn').addEventListener('click', ()=>openForm({}));
$('#fab').addEventListener('click', ()=>openForm({}));
function openSide(){ $('#side').classList.add('open'); $('#backdrop').classList.add('show'); }
function closeSide(){ if(!$('#side').classList.contains('open')) return; $('#side').classList.remove('open'); if(!modalType) $('#backdrop').classList.remove('show'); }
$('#menuBtn').addEventListener('click', openSide);
$('#sideClose').addEventListener('click', closeSide);

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(modalType){ closeModal(); return; }
    if($('#side').classList.contains('open')){ closeSide(); return; }
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')) || e.target.isContentEditable;
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(modalType==='details' && e.key.toLowerCase()==='e'){ const b=$('#dEdit'); if(b){ e.preventDefault(); b.click(); } return; }
  if(modalType) return;
  const k = e.key.toLowerCase();
  if(k==='t') goToday();
  else if(k==='d') setView('day');
  else if(k==='w') setView('week');
  else if(k==='m') setView('month');
  else if(k==='j' || e.key==='ArrowRight') go(-1);     // RTL: right = back in time
  else if(k==='k' || e.key==='ArrowLeft') go(1);
  else if(k==='n' || k==='c'){ e.preventDefault(); openForm({}); }
  else if(k==='/'){ e.preventDefault(); $('#searchInput').focus(); }
  else if(k==='q'){ e.preventDefault(); $('#quickInput').focus(); }
});

// swipe between days / weeks / months (RTL: swipe right = next)
(function(){
  let x0=null, y0=0, t0=0;
  const v = $('#view');
  v.addEventListener('touchstart', e=>{ if(e.touches.length!==1) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); }, {passive:true});
  v.addEventListener('touchend', e=>{
    if(x0==null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0=null;
    if(Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now()-t0 < 600){ lastPointer='touch'; go(dx>0 ? 1 : -1); }
  }, {passive:true});
})();

/* =====================================================================
   Start
   ===================================================================== */
let resizeT = null, wasMobile = isMobile();
window.addEventListener('resize', ()=>{
  clearTimeout(resizeT);
  resizeT = setTimeout(()=>{ const m = isMobile(); if(m!==wasMobile){ wasMobile=m; closeSide(); } S._keepScroll = $('#gs')?$('#gs').scrollTop:null; renderTop(); renderView(); S._keepScroll=null; }, 120);
});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ tick(); syncGoogle(); } });
window.addEventListener('focus', ()=>syncGoogle());
setInterval(tick, 30e3);
setInterval(()=>{ if(document.visibilityState==='visible') syncGoogle(true); }, 5*60e3);

loadLocal();
loadGCache();
renderAll();
// Google Identity Services loads async; once it's there, sync silently if we already have a session
(function waitGIS(n){
  if(window.google && google.accounts && google.accounts.oauth2){ initGIS(); if(gConnected()) syncGoogle(true); else renderConn(); return; }
  if(n>0) setTimeout(()=>waitGIS(n-1), 250); else if(gConnected() && tokenValid()) syncGoogle(true);
})(40);

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
