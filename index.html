<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Event Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Event Planner">
<meta name="theme-color" content="#0B0E17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0B0E17; --surface:#141826; --surface2:#1B2033; --border:#252B40;
  --text:#EEF0F7; --muted:#8991AC; --accent:#6C5CE7; --accent-dim:rgba(108,92,231,.16);
  --accent2:#22D3A5; --accent2-dim:rgba(34,211,165,.14); --danger:#F26D6D;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
html{scroll-padding-top:var(--sat);}
body{
  background:
    radial-gradient(ellipse 600px 400px at 50% -10%, rgba(108,92,231,.16), transparent 60%),
    var(--bg);
  color:var(--text); font-family:'Heebo',sans-serif;
  min-height:100dvh; overflow-x:hidden;
}
.app{
  max-width:480px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:calc(var(--sat) + 14px) 18px 0;
}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.brand{font-size:17px; font-weight:800; letter-spacing:-.3px; display:flex; align-items:center; gap:7px;}
.icon-btn{
  width:38px; height:38px; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--muted); font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-btn:active{transform:scale(.94);}

.stage{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; padding-bottom:16px;}

.composer{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:18px; box-shadow:0 20px 50px -25px rgba(0,0,0,.6);
}
textarea{
  width:100%; min-height:76px; background:transparent; color:var(--text);
  border:none; padding:0; font-size:17.5px; font-family:inherit; resize:none;
  line-height:1.5;
}
textarea::placeholder{color:var(--muted);}
textarea:focus{outline:none;}
.composer.focused{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim), 0 20px 50px -25px rgba(0,0,0,.6);}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; transition:opacity .15s, max-height .2s; overflow:hidden;}
.chips.hidden{opacity:0; max-height:0; margin-top:0;}
.chip{
  background:var(--surface2); border:1px solid var(--border); color:var(--muted);
  padding:8px 13px; border-radius:100px; font-size:12.5px; cursor:pointer; font-family:inherit;
}
.chip:active{transform:scale(.95);}

.composer .btn-primary{margin-top:14px;}
.btn{
  width:100%; border:none; border-radius:var(--r-md); padding:16px; font-size:16px; font-weight:700;
  cursor:pointer; font-family:inherit; min-height:54px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .1s, opacity .15s;
}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55; pointer-events:none;}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 12px 24px -10px rgba(108,92,231,.55);}
.btn-secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
.spinner{
  width:17px; height:17px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff; animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-label{animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.55;}}

/* Event card */
.event-head{display:flex; align-items:center; gap:13px; margin-bottom:16px;}
.event-badge{
  width:52px; height:52px; border-radius:16px; background:var(--accent2-dim);
  display:flex; align-items:center; justify-content:center; font-size:25px; flex-shrink:0;
}
.event-title{font-size:21px; font-weight:800; line-height:1.25;}
.event-meta{display:flex; flex-direction:column; gap:11px; margin-bottom:8px;}
.meta-row{display:flex; align-items:center; gap:11px; font-size:15px; color:var(--text);}
.meta-row .ico{width:20px; text-align:center; opacity:.8; flex-shrink:0; font-size:15px;}
.pill{display:inline-block; font-size:12px; color:var(--accent2); background:var(--accent2-dim); padding:5px 11px; border-radius:100px; margin-top:6px;}
.event-actions{display:flex; gap:10px; margin-top:20px;}
.event-actions .btn{margin-top:0;}
.toast{font-size:13.5px; margin-top:12px; text-align:center; min-height:0; line-height:1.5;}
.toast.ok{color:var(--accent2);}
.toast.err{color:var(--danger);}
.success-state{display:none; flex-direction:column; align-items:center; justify-content:center; padding:22px 0 10px; gap:12px;}
.check-badge{
  width:62px; height:62px; border-radius:50%; background:var(--accent2-dim); color:var(--accent2);
  font-size:28px; display:flex; align-items:center; justify-content:center;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;}}
.success-label{font-size:15px; font-weight:700;}

/* Sheets */
.backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;}
.backdrop.show{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; background:var(--surface);
  border-radius:24px 24px 0 0; padding:10px 18px calc(var(--sab) + 20px);
  max-width:480px; margin:0 auto; transform:translateY(100%);
  transition:transform .25s cubic-bezier(.2,.8,.2,1); z-index:50; max-height:85vh; overflow-y:auto;
  border:1px solid var(--border); border-bottom:none;
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:4px; margin:6px auto 16px;}
.sheet h2{font-size:17px; margin:0 0 16px; font-weight:800;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:13px;}
.field label{font-size:12.5px; color:var(--muted); font-weight:500;}
input[type=text], input[type=date], input[type=time], select{
  background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:13px 12px; font-size:16px; font-family:inherit; width:100%;
}
.timegrid{display:flex; gap:10px;}
.timegrid .field{flex:1;}
.settings p{font-size:12.5px; color:var(--muted); line-height:1.65; margin:0 0 14px;}
.settings a{color:var(--accent2);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">📅 Event Planner</div>
    <button type="button" class="icon-btn" id="settingsToggle">⚙️</button>
  </div>

  <main class="stage">
    <div class="composer" id="composer">
      <textarea id="input" rows="3" placeholder="מה קורה? למשל: סרט בקניון גי ביום חמישי 20:00"></textarea>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-ex="סרט בקניון גי">סרט בקניון גי</button>
        <button type="button" class="chip" data-ex="סלסה ביום שלישי">סלסה ביום שלישי</button>
        <button type="button" class="chip" data-ex="ארוחה בתל אביב בערב">ארוחה בתל אביב בערב</button>
      </div>
      <button type="button" class="btn btn-primary" id="analyzeBtn">
        <span class="spinner" id="spinner" style="display:none;"></span>
        <span id="analyzeLabel">צור אירוע</span>
      </button>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="previewSheet">
  <div class="sheet-handle"></div>
  <div id="previewContent">
    <div class="event-head">
      <span class="event-badge" id="catIcon">📌</span>
      <div class="event-title" id="pTitle">שם האירוע</div>
    </div>
    <div class="event-meta">
      <div class="meta-row" id="pLocLine" style="display:none;"><span class="ico">📍</span><span id="pLoc">-</span></div>
      <div class="meta-row"><span class="ico">📅</span><span id="pDate">-</span></div>
      <div class="meta-row"><span class="ico">🕐</span><span id="pTime">-</span></div>
      <div class="meta-row"><span class="ico">🏷️</span><span id="pCat">-</span></div>
    </div>
    <span class="pill" id="overnightNote" style="display:none;"></span>
    <div class="event-actions">
      <button type="button" class="btn btn-secondary" id="editBtn">עריכה</button>
      <button type="button" class="btn btn-primary" id="calBtn">✓ אישור</button>
    </div>
    <div class="toast" id="statusMsg"></div>
  </div>
  <div class="success-state" id="successState">
    <div class="check-badge">✓</div>
    <div class="success-label">נוסף ליומן</div>
  </div>
</div>

<div class="sheet" id="editSheet">
  <div class="sheet-handle"></div>
  <h2>עריכת אירוע</h2>
  <div class="field"><label>שם האירוע</label><input type="text" id="eTitle"></div>
  <div class="field"><label>מיקום</label><input type="text" id="eLoc" placeholder="קניון גי"></div>
  <div class="field"><label>תאריך התחלה</label><input type="date" id="eDate"></div>
  <div class="field"><label>תאריך סיום</label><input type="date" id="eEndDate"></div>
  <div class="timegrid">
    <div class="field"><label>שעת התחלה</label><input type="time" id="eStart"></div>
    <div class="field"><label>שעת סיום</label><input type="time" id="eEnd"></div>
  </div>
  <div class="field"><label>קטגוריה</label><select id="eCat"></select></div>
  <div class="field"><label>הערות</label><input type="text" id="eNotes"></div>
  <button type="button" class="btn btn-primary" id="applyBtn">שמירת שינויים</button>
</div>

<div class="sheet settings" id="settingsPanel">
  <div class="sheet-handle"></div>
  <h2>הגדרות</h2>
  <p>
    צריך Google OAuth Client ID אישי (פעם אחת, חינם) כדי להוסיף אירועים ליומן בלי לצאת מהעמוד.
    <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> → Client ID מסוג Web application → הוסף את כתובת האתר הזה כ-Authorized JavaScript origin.
  </p>
  <div class="field"><label>Google Client ID</label><input type="text" id="clientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com"></div>
  <button type="button" class="btn btn-primary" id="saveClientId">שמור</button>
</div>

<script>
const CATS = [
  {k:'friends', e:'🎉', l:'יציאה עם חברים', words:['חברים','יציאה']},
  {k:'bar', e:'🍻', l:'ברים / מסיבות', words:['בר','מסיבה','פאב','שתייה']},
  {k:'beach', e:'🏖️', l:'ים / בריכה', words:['ים','בריכה','חוף']},
  {k:'dance', e:'💃', l:'סלסה / ריקודים', words:['סלסה','ריקוד','ריקודים','באצ׳טה','דאנס']},
  {k:'gym', e:'🏋️', l:'חדר כושר', words:['כושר','ג׳ים','אימון','חדר כושר']},
  {k:'trip', e:'✈️', l:'טיולים', words:['טיול','טיסה','נסיעה','חופשה']},
  {k:'games', e:'🎮', l:'משחקים', words:['משחק','גיימינג','פלייסטיישן','משחקים']},
  {k:'movie', e:'🎬', l:'סרטים / בידור', words:['סרט','קולנוע','הופעה','מופע']},
  {k:'family', e:'👨‍👩‍👦', l:'משפחה', words:['משפחה','הורים','סבתא','סבא']},
  {k:'date', e:'❤️', l:'דייטים', words:['דייט','רומנטי']},
  {k:'study', e:'📚', l:'לימודים', words:['לימוד','שיעור','בחינה','מבחן','קורס']},
  {k:'work', e:'💼', l:'עבודה', words:['עבודה','פגישה','ישיבה','מייל']},
  {k:'other', e:'📌', l:'אחר', words:[]}
];
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const TIME_OF_DAY = {
  'בבוקר': {h:9, m:0}, 'בצהריים': {h:13, m:0}, 'אחר הצהריים': {h:16, m:0},
  'בערב': {h:19, m:0}, 'בלילה': {h:22, m:0}
};
const HE_PREFIXES = ['ב','ל','מ','ו','ה','כ','ש'];

function pad(n){return String(n).padStart(2,'0');}
function todayLocal(){const d=new Date(); d.setHours(0,0,0,0); return d;}

function tokenCandidates(token){
  const forms = new Set([token]);
  if(token.length>1 && HE_PREFIXES.includes(token[0])){
    forms.add(token.slice(1));
    if(token.length>2 && HE_PREFIXES.includes(token[1])) forms.add(token.slice(2));
  }
  return forms;
}

function detectCategory(text){
  const tokens = text.split(/[^א-ת]+/).filter(Boolean);
  const allForms = new Set();
  tokens.forEach(t=>tokenCandidates(t).forEach(f=>allForms.add(f)));
  for(const c of CATS){
    if(c.k==='other' || c.k==='friends') continue;
    if(c.words.some(w=>allForms.has(w))) return c;
  }
  const friends = CATS.find(c=>c.k==='friends');
  if(friends.words.some(w=>allForms.has(w))) return friends;
  return CATS.find(c=>c.k==='other');
}

function detectDateRange(text){
  const today = todayLocal();
  const dateRegex = /(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/g;
  const matches = [...text.matchAll(dateRegex)];
  function toDate(m){
    let day=+m[1], month=+m[2]-1, year = m[3] ? (m[3].length===2?2000+ +m[3]: +m[3]) : today.getFullYear();
    return new Date(year, month, day);
  }
  if(matches.length>=2) return {start: toDate(matches[0]), end: toDate(matches[1]), strs:[matches[0][0], matches[1][0]], multiDay:true};
  if(matches.length===1) return {start: toDate(matches[0]), end: null, strs:[matches[0][0]], multiDay:false};
  if(text.includes('מחרתיים')){ let d=new Date(today); d.setDate(d.getDate()+2); return {start:d, end:null, strs:['מחרתיים'], multiDay:false}; }
  if(text.includes('מחר')){ let d=new Date(today); d.setDate(d.getDate()+1); return {start:d, end:null, strs:['מחר'], multiDay:false}; }
  if(text.includes('היום')) return {start:today, end:null, strs:['היום'], multiDay:false};
  for(let i=0;i<DAYS.length;i++){
    const dm = text.match(new RegExp('(?:ב)?(?:יום\\s*)?'+DAYS[i]));
    if(dm){
      let d=new Date(today);
      let diff = (i - d.getDay() + 7) % 7;
      if(diff===0 && text.includes('הבא')) diff = 7;
      d.setDate(d.getDate()+diff);
      return {start:d, end:null, strs:[dm[0]], multiDay:false};
    }
  }
  return {start: today, end:null, strs:[], multiDay:false};
}

function timeToParts(str){
  let half = str.includes('וחצי');
  let m = str.match(/(\d{1,2})(?::(\d{2}))?/);
  if(!m) return null;
  return {h:+m[1], m: m[2] ? +m[2] : (half ? 30 : 0)};
}

function detectLabeledTimes(text){
  const sM = text.match(/התחלה[^0-9]{0,6}(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)/);
  const eM = text.match(/סיום[^0-9]{0,6}(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)/);
  if(sM && eM) return {start: timeToParts(sM[1]), end: timeToParts(eM[1]), strs:[sM[0], eM[0]]};
  return null;
}

function detectTimes(text){
  let m = text.match(/(?:בין|מ-?|משעה)?\s*(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)\s*(?:-|–|עד|ל-?)\s*(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)/);
  if(m){
    const s=timeToParts(m[1]), e=timeToParts(m[2]);
    if(s&&e) return {start:s,end:e};
  }
  let m2 = text.match(/(?:ב-?|בשעה\s*)(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)/);
  if(m2){
    const s=timeToParts(m2[1]);
    if(s) return {start:s,end:null};
  }
  return {start:null,end:null};
}

function stripStrings(text, strs){
  let t = text;
  (strs||[]).forEach(s=>{ if(s) t = t.replace(s,' '); });
  return t;
}

function cleanConnectors(text){
  const stop = new Set(['בין','מ-','משעה','עד','ל-','היום','מחר','מחרתיים','הבא','ב-','בשעה','התחלה','סיום','-','–']);
  const words = text.split(/\s+/).filter(w=>w && !stop.has(w));
  return words.join(' ').trim();
}

const CATEGORY_WORDS = new Set(CATS.flatMap(c=>c.words));

// Splits remaining text into {title, location}. A 'ב'-prefixed word that is
// NOT the very first word, and not itself a known category word, marks the
// start of a location phrase.
function splitLocation(text){
  const words = text.split(/\s+/).filter(Boolean);
  for(let i=1;i<words.length;i++){
    if(words[i][0]==='ב' && words[i].length>1 && !CATEGORY_WORDS.has(words[i])){
      const title = words.slice(0,i).join(' ').trim();
      const location = (words[i].slice(1) + ' ' + words.slice(i+1).join(' ')).trim();
      if(title) return {title, location};
    }
  }
  return {title: words.join(' ').trim(), location:''};
}

let state = null;

function setBtnLoading(on){
  const label = document.getElementById('analyzeLabel');
  document.getElementById('spinner').style.display = on ? 'inline-block' : 'none';
  label.textContent = on ? 'מעבד את האירוע…' : 'צור אירוע';
  label.classList.toggle('loading-label', on);
  document.getElementById('analyzeBtn').disabled = on;
}

function analyze(){
  const raw = document.getElementById('input').value.trim();
  if(!raw) return;
  setBtnLoading(true);

  setTimeout(()=>{
    const cat = detectCategory(raw);
    const dr = detectDateRange(raw);

    const labeled = detectLabeledTimes(raw);
    let times, timeStrs;
    if(labeled){
      times = labeled; timeStrs = labeled.strs.slice();
    } else {
      times = detectTimes(raw);
      const rangeMatch = raw.match(/(?:בין|מ-?|משעה)?\s*\d{1,2}(?::\d{2})?(?:\s*וחצי)?\s*(?:-|–|עד|ל-?)\s*\d{1,2}(?::\d{2})?(?:\s*וחצי)?/);
      const singleMatch = raw.match(/(?:ב-?|בשעה\s*)\d{1,2}(?::\d{2})?(?:\s*וחצי)?/);
      timeStrs = [rangeMatch?rangeMatch[0]:null, singleMatch?singleMatch[0]:null].filter(Boolean);
    }
    if(!times.start){
      for(const w in TIME_OF_DAY){
        if(raw.includes(w)){ times = {start:TIME_OF_DAY[w], end:null}; timeStrs.push(w); break; }
      }
    }

    let clean = stripStrings(raw, dr.strs);
    clean = stripStrings(clean, timeStrs);
    clean = cleanConnectors(clean);
    const {title, location} = splitLocation(clean);

    const startH = times.start ? times.start.h : 19;
    const startM = times.start ? times.start.m : 0;
    let endH, endM;
    if(times.end){ endH=times.end.h; endM=times.end.m; } else { endH=(startH+1)%24; endM=startM; }

    let startDate = new Date(dr.start); startDate.setHours(startH, startM, 0, 0);
    let endBase = (dr.multiDay && dr.end) ? dr.end : dr.start;
    let endDate = new Date(endBase); endDate.setHours(endH, endM, 0, 0);
    let overnight = false;
    if(!dr.multiDay && endDate <= startDate){ endDate.setDate(endDate.getDate()+1); overnight = true; }
    const multiDay = startDate.toDateString() !== endDate.toDateString();

    state = { title: title || 'אירוע חדש', cat: cat.k, start: startDate, end: endDate, location, notes:'', overnight, multiDay };
    fillCatSelect();
    render();
    setBtnLoading(false);
    document.getElementById('previewContent').style.display = 'block';
    document.getElementById('successState').style.display = 'none';
    openSheet('previewSheet');
  }, 380);
}

function fillCatSelect(){
  const sel = document.getElementById('eCat');
  sel.innerHTML = CATS.map(c=>`<option value="${c.k}">${c.e} ${c.l}</option>`).join('');
}
function catObj(k){ return CATS.find(c=>c.k===k) || CATS[CATS.length-1]; }

function render(){
  const c = catObj(state.cat);
  document.getElementById('catIcon').textContent = c.e;
  document.getElementById('pTitle').textContent = state.title;
  const dOpts = {day:'2-digit', month:'2-digit', year:'numeric'};
  document.getElementById('pDate').textContent = state.multiDay
    ? `${state.start.toLocaleDateString('he-IL', dOpts)} – ${state.end.toLocaleDateString('he-IL', dOpts)}`
    : state.start.toLocaleDateString('he-IL', dOpts);
  document.getElementById('pTime').textContent = `${pad(state.start.getHours())}:${pad(state.start.getMinutes())} – ${pad(state.end.getHours())}:${pad(state.end.getMinutes())}`;
  document.getElementById('pCat').textContent = `${c.e} ${c.l}`;
  const note = document.getElementById('overnightNote');
  if(state.multiDay){ note.style.display='inline-block'; note.textContent='📆 אירוע רב-יומי'; }
  else if(state.overnight){ note.style.display='inline-block'; note.textContent='⤴️ מסתיים למחרת'; }
  else note.style.display='none';
  const locLine = document.getElementById('pLocLine');
  if(state.location){ locLine.style.display='flex'; document.getElementById('pLoc').textContent = state.location; }
  else locLine.style.display='none';

  document.getElementById('eTitle').value = state.title;
  document.getElementById('eLoc').value = state.location;
  document.getElementById('eDate').value = `${state.start.getFullYear()}-${pad(state.start.getMonth()+1)}-${pad(state.start.getDate())}`;
  document.getElementById('eEndDate').value = `${state.end.getFullYear()}-${pad(state.end.getMonth()+1)}-${pad(state.end.getDate())}`;
  document.getElementById('eStart').value = `${pad(state.start.getHours())}:${pad(state.start.getMinutes())}`;
  document.getElementById('eEnd').value = `${pad(state.end.getHours())}:${pad(state.end.getMinutes())}`;
  document.getElementById('eCat').value = state.cat;
  document.getElementById('eNotes').value = state.notes;
}

function applyEdits(){
  const [y,mo,da] = document.getElementById('eDate').value.split('-').map(Number);
  const [y2,mo2,da2] = document.getElementById('eEndDate').value.split('-').map(Number);
  const [sh,sm] = document.getElementById('eStart').value.split(':').map(Number);
  const [eh,em] = document.getElementById('eEnd').value.split(':').map(Number);
  let s = new Date(y, mo-1, da, sh, sm);
  let e = new Date(y2, mo2-1, da2, eh, em);
  let overnight = false;
  if(e <= s && y===y2 && mo===mo2 && da===da2){ e.setDate(e.getDate()+1); overnight = true; }
  const multiDay = s.toDateString() !== e.toDateString();
  state = {
    title: document.getElementById('eTitle').value.trim() || 'אירוע חדש',
    cat: document.getElementById('eCat').value,
    start: s, end: e,
    location: document.getElementById('eLoc').value.trim(),
    notes: document.getElementById('eNotes').value.trim(),
    overnight, multiDay
  };
  render();
  switchSheet('editSheet', 'previewSheet');
}

// ---- Google Calendar (in-page, no redirect) ----
let tokenClient = null;
let accessToken = null;
function getClientId(){ return localStorage.getItem('gcal_client_id') || ''; }
function setStatus(msg, cls){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' '+cls : '');
}
function initGIS(){
  const cid = getClientId();
  if(!cid || !window.google || !google.accounts) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: ()=>{}
  });
}
function ensureToken(forceConsent){
  return new Promise((resolve, reject)=>{
    const cid = getClientId();
    if(!cid){ reject({code:'no-client-id'}); return; }
    if(!tokenClient) initGIS();
    if(!tokenClient){ reject({code:'gis-not-ready'}); return; }
    tokenClient.callback = (resp)=>{
      if(resp.error){
        if(!forceConsent){ ensureToken(true).then(resolve).catch(reject); }
        else reject(resp);
        return;
      }
      accessToken = resp.access_token;
      resolve(accessToken);
    };
    tokenClient.requestAccessToken({prompt: forceConsent ? 'consent' : ''});
  });
}
function toRFC3339(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
}
async function addToCalendar(){
  try{
    setStatus('מתחבר ל-Google…');
    const token = await ensureToken(false);
    setStatus('מוסיף אירוע…');
    const c = catObj(state.cat);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const body = {
      summary: state.title,
      location: state.location || undefined,
      description: `${c.e} ${c.l}${state.notes ? ' — ' + state.notes : ''}`,
      start: { dateTime: toRFC3339(state.start), timeZone: tz },
      end: { dateTime: toRFC3339(state.end), timeZone: tz }
    };
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      if(res.status === 401) accessToken = null;
      throw await res.json().catch(()=>({}));
    }
    setStatus('');
    document.getElementById('previewContent').style.display = 'none';
    document.getElementById('successState').style.display = 'flex';
    setTimeout(()=>{
      closeAllSheets();
      document.getElementById('input').value = '';
      document.getElementById('chips').classList.remove('hidden');
      document.getElementById('previewContent').style.display = 'block';
      document.getElementById('successState').style.display = 'none';
    }, 1300);
  } catch(err){
    if(err && err.code === 'no-client-id'){
      switchSheet('previewSheet','settingsPanel');
      setStatus('צריך קודם להגדיר Google Client ID (⚙️)', 'err');
    } else {
      setStatus('❌ לא הצלחנו להוסיף את האירוע, נסה שוב', 'err');
    }
  }
}

// ---- Sheets ----
function openSheet(id){
  document.getElementById(id).classList.add('show');
  document.getElementById('backdrop').classList.add('show');
}
function closeAllSheets(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
  document.getElementById('backdrop').classList.remove('show');
}
function closeSheet(id){ closeAllSheets(); }
function switchSheet(fromId, toId){
  document.getElementById(fromId).classList.remove('show');
  document.getElementById(toId).classList.add('show');
  document.getElementById('backdrop').classList.add('show');
}

document.getElementById('analyzeBtn').addEventListener('click', ()=>{
  document.getElementById('input').blur();
  analyze();
});
document.getElementById('editBtn').addEventListener('click', ()=>switchSheet('previewSheet','editSheet'));
document.getElementById('applyBtn').addEventListener('click', applyEdits);
document.getElementById('calBtn').addEventListener('click', addToCalendar);
document.getElementById('backdrop').addEventListener('click', closeAllSheets);
document.getElementById('settingsToggle').addEventListener('click', ()=>{
  document.getElementById('clientIdInput').value = getClientId();
  openSheet('settingsPanel');
});
document.getElementById('saveClientId').addEventListener('click', ()=>{
  localStorage.setItem('gcal_client_id', document.getElementById('clientIdInput').value.trim());
  accessToken = null;
  initGIS();
  closeAllSheets();
  setStatus('נשמר ✓', 'ok');
});
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{
    document.getElementById('input').value = ch.dataset.ex;
    analyze();
  });
});
document.getElementById('input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); analyze(); }
});
document.getElementById('input').addEventListener('input', (e)=>{
  document.getElementById('chips').classList.toggle('hidden', e.target.value.trim().length>0);
});
document.getElementById('input').addEventListener('focus', ()=>{
  document.getElementById('composer').classList.add('focused');
});
document.getElementById('input').addEventListener('blur', ()=>{
  document.getElementById('composer').classList.remove('focused');
});
window.addEventListener('load', initGIS);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
