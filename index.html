<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Planner</title>
<meta name="description" content="יומן אישי מהיר עם חיבור ל-Google Calendar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Event Planner">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#FFFFFF; --soft:#F6F7F9; --soft2:#EFF1F4; --line:#EEF0F3; --line2:#E3E6EB;
  --ink:#111827; --ink2:#4B5563; --muted:#8A93A3;
  --accent:#5B5BD6; --accent-ink:#FFFFFF; --accent-soft:#EFEFFD; --accent-2:#4747C2;
  --now:#EF4444; --danger:#DC2626; --danger-soft:#FEF2F2; --ok:#0F9D58;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(17,24,39,.05);
  --sh-2:0 1px 2px rgba(17,24,39,.04), 0 6px 16px -8px rgba(17,24,39,.14);
  --sh-3:0 2px 6px rgba(17,24,39,.05), 0 24px 60px -20px rgba(17,24,39,.35);
  --hh:52px;                       /* hour height in day/week view */
  --gutter:58px;
  --side:292px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{background:var(--bg); color:var(--ink); font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif; font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0;}
input,select,textarea{font:inherit; color:inherit;}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px;}
svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
kbd{font:600 11px/1 'Heebo',sans-serif; color:var(--muted); border:1px solid var(--line2); border-bottom-width:2px; border-radius:6px; padding:3px 6px; background:#fff;}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:var(--side) minmax(0,1fr); height:100dvh;}
.side{border-inline-end:1px solid var(--line); padding:18px 16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; background:var(--bg); scrollbar-width:thin;}
.side > *{flex-shrink:0;}
.main{display:flex; flex-direction:column; min-width:0; min-height:0; position:relative;}
.only-m{display:none !important;}

/* ---------- sidebar ---------- */
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; letter-spacing:-.2px;}
.brand img{width:30px; height:30px; border-radius:9px;}
.side-head{display:flex; align-items:center; justify-content:space-between;}
.greet{margin-top:-6px;}
.greet b{display:block; font-size:21px; font-weight:800; letter-spacing:-.3px; line-height:1.25;}
.greet span{color:var(--muted); font-size:13.5px;}
.btn-create{display:flex; align-items:center; justify-content:center; gap:8px; height:48px; border-radius:14px; background:var(--accent); color:var(--accent-ink);
  font-weight:700; font-size:15.5px; box-shadow:0 10px 22px -12px var(--accent); transition:transform .12s, background .15s, box-shadow .2s;}
.btn-create:hover{background:var(--accent-2); box-shadow:0 12px 26px -12px var(--accent);}
.btn-create:active{transform:scale(.98);}
.btn-create svg{width:19px; height:19px; stroke-width:2.4;}

.quick{position:relative;}
.quick input{width:100%; height:44px; border-radius:12px; border:1px solid var(--line2); background:var(--soft); padding:0; padding-inline:40px 56px; font-size:14px; transition:border-color .15s, background .15s, box-shadow .15s;}
.quick input::placeholder{color:var(--muted);}
.quick input:focus{outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.quick .qicon{position:absolute; inset-inline-start:13px; top:12px; color:var(--muted); width:20px; height:20px;}
.quick .qhint{position:absolute; inset-inline-end:10px; top:12px; opacity:0; transition:opacity .15s;}
.quick input:focus ~ .qhint{opacity:1;}
.qprev{display:none; flex-wrap:wrap; gap:6px; margin-top:8px; animation:fadeUp .15s var(--ease);}
.qprev.show{display:flex;}
.qchip{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; color:var(--ink2); background:var(--soft); border-radius:99px; padding:3px 9px;}
.qchip.dim{color:var(--muted); font-weight:500;}

.sec-title{display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.02em; margin:0 2px 8px;}

/* mini month */
.mini-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; padding:0 2px;}
.mini-head b{font-size:14px; font-weight:700;}
.mini-nav{display:flex; gap:2px;}
.mini-nav button{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--ink2);}
.mini-nav button:hover{background:var(--soft);}
.mini-nav svg{width:16px; height:16px;}
.mini-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; text-align:center;}
.mini-grid .wd{font-size:11px; color:var(--muted); font-weight:600; padding:4px 0;}
.mini-grid button{position:relative; height:32px; border-radius:9px; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink); transition:background .12s;}
.mini-grid button:hover{background:var(--soft);}
.mini-grid button.out{color:#C0C6D0;}
.mini-grid button.inrange{background:var(--accent-soft); border-radius:0;}
.mini-grid button.sel{background:var(--accent-soft); color:var(--accent); font-weight:700;}
.mini-grid button.today{color:#fff; font-weight:700;}
.mini-grid button.today::before{content:""; position:absolute; inset:3px 50%; width:26px; height:26px; transform:translateX(50%); border-radius:50%; background:var(--accent); z-index:0;}
.mini-grid button span{position:relative; z-index:1;}
.mini-grid button.has::after{content:""; position:absolute; bottom:2px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--muted); opacity:.6;}
.mini-grid button.today.has::after{background:var(--accent); opacity:1; bottom:0;}

/* next up + upcoming */
.next{position:relative; border-radius:var(--r-lg); padding:14px 14px 13px; background:linear-gradient(135deg, color-mix(in srgb,var(--c) 14%, #fff), color-mix(in srgb,var(--c) 5%, #fff));
  border:1px solid color-mix(in srgb,var(--c) 18%, #fff); cursor:pointer; text-align:start; width:100%; display:block; transition:transform .12s, box-shadow .2s;}
.next:hover{box-shadow:var(--sh-2);}
.next:active{transform:scale(.99);}
.next .k{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:color-mix(in srgb,var(--c) 70%, #000); letter-spacing:.02em;}
.next .k i{width:7px; height:7px; border-radius:50%; background:var(--c); box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 50%, transparent); animation:pulse 2s infinite;}
.next .t{display:block; font-size:16.5px; font-weight:800; margin:5px 0 2px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.next .m{display:block; font-size:13px; color:var(--ink2);}
.next .cd{display:inline-block; margin-top:9px; font-size:12.5px; font-weight:700; background:#fff; border-radius:99px; padding:3px 10px; color:var(--ink); box-shadow:var(--sh-1);}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%, transparent);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;}}
.up-day{font-size:12px; font-weight:700; color:var(--ink2); margin:12px 2px 4px;}
.up-day:first-child{margin-top:0;}
.up-item{display:flex; align-items:center; gap:10px; width:100%; padding:7px 8px; border-radius:10px; text-align:start; transition:background .12s;}
.up-item:hover{background:var(--soft);}
.up-item .bar{width:3px; align-self:stretch; border-radius:3px; background:var(--c); flex:none;}
.up-item .tx{min-width:0; flex:1;}
.up-item b{display:block; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.up-item small{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;}
.up-empty{border:1.5px dashed var(--line2); border-radius:14px; padding:16px 14px; text-align:center; color:var(--muted); font-size:13px;}
.up-empty button{display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:13px;}
.sk{height:40px; border-radius:10px; margin:6px 0; background:linear-gradient(90deg,var(--soft) 25%,#fafbfc 50%,var(--soft) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}

/* filters */
.flist{display:flex; flex-direction:column; gap:1px;}
.fitem{display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:9px; font-size:13.5px; text-align:start; width:100%; transition:background .12s;}
.fitem:hover{background:var(--soft);}
.fbox{width:18px; height:18px; border-radius:5px; border:2px solid var(--c); background:var(--c); display:grid; place-items:center; flex:none; transition:background .15s;}
.fbox svg{width:12px; height:12px; stroke:#fff; stroke-width:3.2;}
.fitem.off .fbox{background:transparent;}
.fitem.off .fbox svg{opacity:0;}
.fitem.off .fl{color:var(--muted);}
.fl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cats{display:flex; flex-wrap:wrap; gap:6px;}
.catchip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:4px 10px 4px 9px; border-radius:99px; border:1px solid var(--line2); background:#fff; transition:all .15s;}
.catchip i{width:8px; height:8px; border-radius:50%; background:var(--c);}
.catchip:hover{border-color:color-mix(in srgb,var(--c) 45%, #fff);}
.catchip.off{opacity:.45; text-decoration:line-through;}
.link-btn{font-size:12px; font-weight:600; color:var(--accent);}

.gconn{margin-top:auto; border-radius:14px; background:var(--soft); padding:12px 13px; font-size:13px; display:flex; align-items:center; gap:10px;}
.gconn .gi{width:30px; height:30px; border-radius:9px; background:#fff; display:grid; place-items:center; box-shadow:var(--sh-1); flex:none;}
.gconn .gt{flex:1; min-width:0;}
.gconn .gt b{display:block; font-size:13px;}
.gconn .gt span{color:var(--muted); font-size:12px;}
.gconn .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-inline-end:5px; vertical-align:1px;}
.gconn .dot.warn{background:#F59E0B;}
.gconn button.gbtn{font-weight:700; color:var(--accent); font-size:13px; white-space:nowrap;}
.gconn button.ic{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:var(--ink2);}
.gconn button.ic:hover{background:#fff;}
.gconn button.ic svg{width:16px; height:16px;}
.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- top bar ---------- */
.top{display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--line); min-height:68px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); position:relative; z-index:5;}
.btn-today{height:36px; padding:0 16px; border-radius:10px; border:1px solid var(--line2); font-weight:700; font-size:14px; background:#fff; transition:background .12s, border-color .12s;}
.btn-today:hover{background:var(--soft);}
.btn-today.here{color:var(--muted); font-weight:600;}
.navs{display:flex; gap:2px;}
.icon-btn{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; color:var(--ink2); transition:background .12s, color .12s;}
.icon-btn:hover{background:var(--soft); color:var(--ink);}
.icon-btn:active{transform:scale(.94);}
.range-title{font-size:20px; font-weight:800; letter-spacing:-.3px; margin:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.range-title small{font-weight:500; color:var(--muted); font-size:15px; margin-inline-start:6px;}
.spacer{flex:1;}
.seg{display:flex; background:var(--soft); border-radius:11px; padding:3px; gap:2px;}
.seg button{height:30px; padding:0 14px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink2); transition:background .15s, color .15s, box-shadow .15s;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:#fff; color:var(--ink); box-shadow:var(--sh-1), 0 0 0 1px var(--line);}

.search{position:relative; width:260px;}
.search input{width:100%; height:38px; border-radius:11px; border:1px solid var(--line2); background:var(--soft); padding:0 36px 0 12px; font-size:14px; transition:all .15s;}
.search input:focus{outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.search .sicon{position:absolute; inset-inline-start:11px; top:10px; width:18px; height:18px; color:var(--muted); pointer-events:none;}
.search input{padding-inline-start:36px; padding-inline-end:12px;}
.spanel{position:absolute; top:46px; inset-inline-start:0; width:380px; max-height:min(480px,70vh); overflow:auto; background:#fff; border-radius:16px; box-shadow:var(--sh-3); border:1px solid var(--line);
  padding:8px; display:none; z-index:30; animation:fadeUp .15s var(--ease);}
.spanel.show{display:block;}
.s-sec{font-size:11.5px; font-weight:700; color:var(--muted); padding:8px 10px 4px;}
.s-item{display:flex; align-items:center; gap:12px; width:100%; padding:9px 10px; border-radius:11px; text-align:start;}
.s-item.act, .s-item:hover{background:var(--soft);}
.s-date{width:44px; flex:none; text-align:center; line-height:1.1;}
.s-date b{display:block; font-size:18px; font-weight:800;}
.s-date small{font-size:11px; color:var(--muted);}
.s-item .tx{flex:1; min-width:0;}
.s-item .tx b{display:block; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.s-item .tx small{color:var(--muted); font-size:12.5px;}
.s-item i.dot{width:9px; height:9px; border-radius:50%; background:var(--c); flex:none;}
.s-item mark{background:color-mix(in srgb,var(--accent) 16%, #fff); color:inherit; border-radius:3px; padding:0 1px;}
.s-empty{padding:26px 10px; text-align:center; color:var(--muted); font-size:13.5px;}
.s-more{padding:6px 10px 8px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}

.busy{position:absolute; top:67px; inset-inline:0; height:2px; overflow:hidden; z-index:6; opacity:0; transition:opacity .2s;}
.busy.on{opacity:1;}
.busy::after{content:""; position:absolute; top:0; height:100%; width:30%; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:busy 1.1s ease-in-out infinite;}
@keyframes busy{from{right:-30%;} to{right:100%;}}

/* ---------- views ---------- */
.view{flex:1; min-height:0; display:flex; flex-direction:column; position:relative;}
.view.anim-next{animation:slideN .22s var(--ease);}
.view.anim-prev{animation:slideP .22s var(--ease);}
@keyframes slideN{from{opacity:.3; transform:translateX(-18px);} to{opacity:1; transform:none;}}
@keyframes slideP{from{opacity:.3; transform:translateX(18px);} to{opacity:1; transform:none;}}
@keyframes fadeUp{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* day / week grid */
.gh{display:grid; grid-template-columns:var(--gutter) repeat(var(--n),minmax(0,1fr)); border-bottom:1px solid var(--line); padding-inline-end:var(--sbw,0px);}
.gh-day{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px; cursor:pointer; border-radius:12px; margin:4px 2px; transition:background .12s;}
.gh-day:hover{background:var(--soft);}
.gh-day .w{font-size:12px; font-weight:600; color:var(--muted);}
.gh-day .n{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:20px; font-weight:700; letter-spacing:-.3px; font-variant-numeric:tabular-nums; transition:background .15s;}
.gh-day.today .w{color:var(--accent);}
.gh-day.today .n{background:var(--accent); color:#fff; box-shadow:0 6px 14px -6px var(--accent);}
.gh-day.past .n{color:var(--ink2);}
.gh.single .gh-day{flex-direction:row; justify-content:flex-start; gap:10px; padding:8px 14px; margin:4px 8px; cursor:default;}
.gh.single .gh-day:hover{background:none;}
.gh .gcorner{display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font-size:10.5px; color:var(--muted);}

.allday{display:grid; grid-template-columns:var(--gutter) repeat(var(--n),minmax(0,1fr)); border-bottom:1px solid var(--line); padding-inline-end:var(--sbw,0px); min-height:0;}
.allday .lbl{font-size:10.5px; color:var(--muted); display:flex; align-items:center; justify-content:center; padding:4px;}
.allday .cell{padding:3px 2px; display:flex; flex-direction:column; gap:2px; border-inline-start:1px solid var(--line); min-width:0;}
.adchip{display:block; width:100%; text-align:start; font-size:12px; font-weight:600; padding:3px 8px; border-radius:7px; background:color-mix(in srgb,var(--c) 16%, #fff);
  color:color-mix(in srgb,var(--c) 62%, #000); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:filter .12s;}
.adchip:hover{filter:brightness(.97);}

.gs{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scroll-behavior:auto; overscroll-behavior:contain;}
.gb{display:grid; grid-template-columns:var(--gutter) repeat(var(--n),minmax(0,1fr)); position:relative; height:calc(var(--hh) * 24);}
.gutter{position:relative;}
.gutter span{position:absolute; inset-inline-end:10px; transform:translateY(-50%); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}
.gutter .nowlbl{color:#fff; background:var(--now); border-radius:6px; padding:1px 5px; font-weight:700; inset-inline-end:6px; z-index:3;}
.col{position:relative; border-inline-start:1px solid var(--line);
  background-image:linear-gradient(to bottom, var(--line) 1px, transparent 1px), linear-gradient(to bottom, transparent calc(var(--hh)/2), #F6F7F9 calc(var(--hh)/2), #F6F7F9 calc(var(--hh)/2 + 1px), transparent calc(var(--hh)/2 + 1px));
  background-size:100% var(--hh); cursor:cell;}
.col.today{background-color:color-mix(in srgb,var(--accent) 3%, #fff);}
.col.weekend{background-color:#FCFCFD;}
.slot-ghost{position:absolute; inset-inline:3px; border-radius:9px; background:var(--accent-soft); border:1.5px dashed color-mix(in srgb,var(--accent) 50%, #fff); color:var(--accent); font-size:12px; font-weight:700;
  padding:3px 8px; pointer-events:none; z-index:2; display:none;}
.slot-ghost.show{display:block;}
.slot-ghost.sel{background:color-mix(in srgb,var(--accent) 16%, #fff); border-style:solid;}

.ev{position:absolute; border-radius:9px; padding:4px 8px 4px 7px; text-align:start; overflow:hidden; z-index:1;
  background:color-mix(in srgb,var(--c) 15%, #fff); color:color-mix(in srgb,var(--c) 48%, #000);
  border-inline-start:3px solid var(--c); box-shadow:0 0 0 1.5px #fff; transition:filter .12s, box-shadow .15s, transform .12s; cursor:pointer; line-height:1.25;}
.ev:hover{filter:brightness(.97); z-index:4; box-shadow:0 0 0 1.5px #fff, var(--sh-2);}
.ev:active{transform:scale(.985);}
.ev b{display:block; font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ev{container-type:inline-size;}
.ev small{display:block; font-size:11.5px; opacity:.85; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ev.short{padding-top:1px; padding-bottom:1px; display:flex; gap:6px; align-items:center;}
.ev.short b{flex:none; max-width:70%;}
.ev.past{opacity:.62;}
.ev.pending{opacity:.6; background-image:repeating-linear-gradient(-45deg, transparent 0 6px, rgba(255,255,255,.55) 6px 12px);}
.ev.is-next{box-shadow:0 0 0 1.5px #fff, 0 0 0 3.5px color-mix(in srgb,var(--c) 45%, #fff), var(--sh-2); z-index:3;}
.ev .tag{display:inline-block; font-size:10px; font-weight:800; background:var(--c); color:#fff; border-radius:5px; padding:0 5px; margin-inline-end:4px; vertical-align:1px;}
.ev.flash, .adchip.flash, .mchip.flash{animation:flash 1.4s var(--ease);}
@keyframes flash{0%,40%{box-shadow:0 0 0 1.5px #fff, 0 0 0 6px color-mix(in srgb,var(--c) 45%, transparent);} 100%{box-shadow:0 0 0 1.5px #fff;}}

.nowline{position:absolute; inset-inline:0; height:2px; background:var(--now); z-index:3; pointer-events:none;}
.nowline::before{content:""; position:absolute; inset-inline-start:-6px; top:-5px; width:12px; height:12px; border-radius:50%; background:var(--now); box-shadow:0 0 0 3px #fff;}
.nowline.faint{background:color-mix(in srgb,var(--now) 30%, transparent); height:1px;}
.nowline.faint::before{display:none;}

.day-empty{position:absolute; top:calc(var(--hh) * 9); inset-inline:calc(var(--gutter) + 20px) 20px; text-align:center; color:var(--muted); pointer-events:none; z-index:0;}
.day-empty b{display:block; font-size:16px; color:var(--ink2); margin-bottom:4px;}
.day-empty span{font-size:13.5px;}
.day-empty .em{font-size:30px; display:block; margin-bottom:6px; opacity:.9;}

/* month */
.month{flex:1; display:grid; grid-template-rows:auto repeat(var(--rows),minmax(0,1fr)); min-height:0;}
.m-wd{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line);}
.m-wd span{font-size:12px; font-weight:600; color:var(--muted); text-align:center; padding:10px 0 8px;}
.m-row{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line); min-height:0;}
.m-row:last-child{border-bottom:0;}
.mcell{border-inline-start:1px solid var(--line); padding:4px 4px 4px; display:flex; flex-direction:column; gap:2px; min-width:0; min-height:0; overflow:hidden; cursor:cell; transition:background .12s;}
.mcell:first-child{border-inline-start:0;}
.mcell:hover{background:#FBFBFC;}
.mcell.out{background:#FCFCFD;}
.mcell.out .mnum{color:#C0C6D0;}
.mnum{align-self:flex-start; min-width:28px; height:28px; padding:0 6px; border-radius:99px; font-size:13px; font-weight:600; display:grid; place-items:center; font-variant-numeric:tabular-nums; transition:background .12s; margin-bottom:1px;}
.mnum:hover{background:var(--soft2);}
.mcell.today .mnum{background:var(--accent); color:#fff;}
.mchip{display:flex; align-items:center; gap:5px; width:100%; font-size:12px; padding:2px 6px; border-radius:6px; text-align:start; white-space:nowrap; overflow:hidden; transition:background .12s; flex:none;}
.mchip:hover{background:var(--soft2);}
.mchip i{width:7px; height:7px; border-radius:50%; background:var(--c); flex:none;}
.mchip b{font-weight:600; overflow:hidden; text-overflow:ellipsis;}
.mchip small{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; flex:none;}
.mchip.ad{background:color-mix(in srgb,var(--c) 15%, #fff); color:color-mix(in srgb,var(--c) 60%, #000);}
.mchip.ad i{display:none;}
.mchip.past{opacity:.6;}
.mmore{font-size:11.5px; font-weight:700; color:var(--ink2); padding:1px 6px; text-align:start; border-radius:6px;}
.mmore:hover{background:var(--soft2);}

/* ---------- modal (dialog on desktop, bottom sheet on phones) ---------- */
.backdrop{position:fixed; inset:0; background:rgba(17,24,39,.28); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;}
.backdrop.show{opacity:1; pointer-events:auto;}
.modal{position:fixed; inset:0; display:grid; place-items:center; z-index:50; pointer-events:none; padding:20px;}
.mcard{pointer-events:auto; width:min(460px,100%); max-height:calc(100dvh - 40px); overflow:auto; background:#fff; border-radius:var(--r-xl); box-shadow:var(--sh-3);
  transform:translateY(8px) scale(.98); opacity:0; transition:transform .2s var(--ease), opacity .18s; position:relative;}
.modal.show .mcard{transform:none; opacity:1;}
.modal:not(.show) .mcard{pointer-events:none;}
.m-top{display:flex; align-items:center; justify-content:flex-end; gap:2px; padding:10px 10px 0;}
.m-top .icon-btn svg{width:18px; height:18px;}
.m-top .icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}
.grab{display:none;}

/* event details */
.d-body{padding:2px 24px 22px;}
.d-head{display:flex; gap:14px; align-items:flex-start;}
.d-badge{width:46px; height:46px; border-radius:14px; background:color-mix(in srgb,var(--c) 15%, #fff); display:grid; place-items:center; font-size:23px; flex:none;}
.d-title{font-size:21px; font-weight:800; line-height:1.25; letter-spacing:-.2px; margin:2px 0 4px; overflow-wrap:anywhere;}
.d-when{color:var(--ink2); font-size:14.5px;}
.d-cd{display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:700; color:color-mix(in srgb,var(--c) 62%, #000); background:color-mix(in srgb,var(--c) 12%, #fff); border-radius:99px; padding:4px 11px;}
.d-cd i{width:6px; height:6px; border-radius:50%; background:var(--c);}
.d-rows{margin-top:18px; display:flex; flex-direction:column; gap:12px;}
.d-row{display:flex; gap:12px; align-items:flex-start; font-size:14.5px; color:var(--ink);}
.d-row svg{color:var(--muted); margin-top:1px;}
.d-row a{color:var(--accent); text-decoration:none; font-weight:600;}
.d-row a:hover{text-decoration:underline;}
.d-row .notes{white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink2);}
.d-row .cal-dot{width:12px; height:12px; border-radius:4px; background:var(--cc); margin:4px 4px 0; flex:none;}
.d-actions{display:flex; gap:8px; margin-top:22px;}
.confirm{margin-top:18px; background:var(--danger-soft); border-radius:14px; padding:14px; display:flex; align-items:center; gap:10px; animation:fadeUp .15s var(--ease);}
.confirm span{flex:1; font-weight:600; color:#991B1B; font-size:14px;}

/* buttons */
.btn{height:42px; padding:0 18px; border-radius:12px; font-weight:700; font-size:14.5px; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:background .15s, transform .1s, box-shadow .15s;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55; pointer-events:none;}
.btn.primary{background:var(--accent); color:#fff; box-shadow:0 8px 18px -10px var(--accent);}
.btn.primary:hover{background:var(--accent-2);}
.btn.ghost{background:var(--soft); color:var(--ink);}
.btn.ghost:hover{background:var(--soft2);}
.btn.danger{background:var(--danger); color:#fff;}
.btn.plain{color:var(--ink2);}
.btn.plain:hover{background:var(--soft);}
.btn svg{width:17px; height:17px;}
.btn .spinner{width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite;}

/* event form */
.f-body{padding:0 22px 20px;}
.f-title{width:100%; border:0; font-size:21px; font-weight:700; padding:6px 0 8px; border-bottom:2px solid var(--line); transition:border-color .15s; background:transparent;}
.f-title:focus{outline:none; border-color:var(--accent);}
.f-title::placeholder{color:#B7BDC8; font-weight:600;}
.f-parse{display:flex; flex-wrap:wrap; gap:6px; min-height:24px; margin:8px 0 2px;}
.f-parse .qchip{background:var(--accent-soft); color:var(--accent);}
.f-grid{display:grid; grid-template-columns:auto 1fr; gap:10px 12px; align-items:center; margin-top:14px;}
.f-grid > svg{color:var(--muted);}
.f-line{display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-width:0;}
.inp{height:38px; border-radius:10px; border:1px solid var(--line2); background:var(--soft); padding:0 10px; font-size:14px; min-width:0; transition:all .15s;}
.inp:focus{outline:none; background:#fff; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.inp.date{flex:1 1 140px;}
.inp.time{width:112px; flex:none; font-variant-numeric:tabular-nums;}
.inp.wide{width:100%;}
textarea.inp{height:auto; min-height:64px; padding:9px 10px; resize:vertical; line-height:1.45;}
.f-sep{color:var(--muted);}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink2); cursor:pointer; user-select:none;}
.toggle input{appearance:none; width:34px; height:20px; border-radius:99px; background:var(--line2); position:relative; transition:background .15s; cursor:pointer; margin:0;}
.toggle input::after{content:""; position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:var(--sh-1); transition:transform .15s var(--ease);}
.toggle input:checked{background:var(--accent);}
.toggle input:checked::after{transform:translateX(-14px);}
.catrow{display:flex; gap:6px; overflow-x:auto; padding:2px 1px 4px; scrollbar-width:none; margin-inline:-1px; -webkit-mask-image:linear-gradient(to left, transparent, #000 14px, #000 calc(100% - 18px), transparent); mask-image:linear-gradient(to left, transparent, #000 14px, #000 calc(100% - 18px), transparent);}
.catrow::-webkit-scrollbar{display:none;}
.catopt{flex:none; display:inline-flex; align-items:center; gap:5px; height:32px; padding:0 11px; border-radius:99px; border:1px solid var(--line2); font-size:13px; background:#fff; transition:all .12s; white-space:nowrap;}
.catopt:hover{border-color:color-mix(in srgb,var(--c) 50%, #fff);}
.catopt.on{background:color-mix(in srgb,var(--c) 14%, #fff); border-color:var(--c); color:color-mix(in srgb,var(--c) 60%, #000); font-weight:700;}
.more-btn{font-size:13px; font-weight:600; color:var(--accent); margin-top:12px; display:inline-flex; align-items:center; gap:4px;}
.f-more{display:none;}
.f-more.show{display:contents;}
.f-foot{display:flex; align-items:center; gap:8px; margin-top:18px;}
.f-foot .hint{flex:1; font-size:12px; color:var(--muted);}
.f-err{color:var(--danger); font-size:13px; margin-top:10px; display:none;}
.f-err.show{display:block;}
.f-examples{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.f-examples button{font-size:12.5px; color:var(--ink2); background:var(--soft); border-radius:99px; padding:4px 11px; transition:background .12s;}
.f-examples button:hover{background:var(--soft2);}
.sel{height:38px; border-radius:10px; border:1px solid var(--line2); background:var(--soft); padding:0 10px; font-size:14px; flex:1; min-width:0;}

/* settings */
.set-body{padding:0 24px 24px;}
.set-body h2{font-size:19px; margin:0 0 6px;}
.set-body p{font-size:13.5px; color:var(--ink2); line-height:1.65; margin:0 0 14px;}
.set-body a{color:var(--accent); font-weight:600;}
.set-body ol{font-size:13.5px; color:var(--ink2); padding-inline-start:20px; margin:0 0 16px; line-height:1.7;}
.set-body label{display:block; font-size:12.5px; font-weight:600; color:var(--ink2); margin-bottom:6px;}
.set-body .inp{width:100%; direction:ltr; text-align:left;}
.origin{direction:ltr; display:inline-block; background:var(--soft); border-radius:6px; padding:0 6px; font-size:12.5px; color:var(--ink);}

/* toasts */
.toasts{position:fixed; bottom:calc(24px + var(--sab)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none;}
.toast{pointer-events:auto; display:flex; align-items:center; gap:14px; background:#111827; color:#fff; border-radius:12px; padding:11px 16px; font-size:14px; box-shadow:var(--sh-3); animation:toastIn .25s var(--ease); max-width:calc(100vw - 32px);}
.toast.err{background:#7F1D1D;}
.toast button{color:#A5B4FC; font-weight:700; font-size:14px;}
.toast.out{animation:toastOut .2s ease forwards;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
@keyframes toastOut{to{opacity:0; transform:translateY(6px);}}

.fab{display:none;}

/* ---------- tablet ---------- */
@media (max-width:1180px){
  .search{width:200px;}
  .spanel{width:340px;}
}
@media (max-width:1024px){
  .app{grid-template-columns:1fr;}
  .only-m{display:grid !important;}
  .only-d{display:none !important;}
  .side{position:fixed; inset-block:0; inset-inline-start:0; width:min(330px,88vw); z-index:45; box-shadow:var(--sh-3); transform:translateX(105%);
    transition:transform .25s var(--ease); padding-top:calc(var(--sat) + 16px); padding-bottom:calc(var(--sab) + 16px);}
  .side.open{transform:none;}
  .fab{display:grid; place-items:center; position:fixed; left:18px; bottom:calc(20px + var(--sab)); width:58px; height:58px; border-radius:18px; background:var(--accent); color:#fff;
    box-shadow:0 14px 28px -10px var(--accent), 0 2px 6px rgba(17,24,39,.15); z-index:20; transition:transform .12s;}
  .fab:active{transform:scale(.94);}
  .fab svg{width:26px; height:26px; stroke-width:2.4;}
  .toasts{bottom:calc(92px + var(--sab));}
  .search{width:44px;}
  .search input{padding:0; width:38px; color:transparent; cursor:pointer; background:transparent; border-color:transparent;}
  .search input::placeholder{color:transparent;}
  .search.open{position:absolute; inset-inline:16px; top:14px; width:auto; z-index:20;}
  .search.open input{width:100%; padding-inline-start:36px; color:var(--ink); cursor:text; background:#fff; border-color:var(--accent);}
  .search.open input::placeholder{color:var(--muted);}
  .search.open .spanel{width:100%;}
}

/* ---------- phones ---------- */
@media (max-width:760px){
  :root{--hh:56px; --gutter:44px;}
  body{font-size:15px;}
  .top{display:grid; grid-template-columns:auto 1fr auto auto; grid-template-areas:"menu title search today" "navs seg seg seg"; gap:8px 6px; padding:calc(var(--sat) + 8px) 12px 10px; min-height:0;}
  #menuBtn{grid-area:menu;}
  .range-title{grid-area:title; font-size:18px; margin:0;}
  .range-title small{display:none;}
  .search{grid-area:search;}
  .btn-today{grid-area:today; height:36px; width:36px; padding:0; border-radius:10px; font-size:13px; position:relative;}
  .navs{grid-area:navs; display:flex;}
  .navs .icon-btn{width:34px; height:38px; background:var(--soft);}
  .seg{grid-area:seg;}
  .seg button{flex:1; height:32px;}
  .busy{top:auto; bottom:auto;}
  .search.open{inset-inline:10px; top:calc(var(--sat) + 8px);}
  .spanel{position:fixed; top:calc(var(--sat) + 60px); inset-inline:10px; width:auto; max-height:calc(100dvh - var(--sat) - 80px);}
  .gh-day{margin:4px 1px; padding:6px 0 6px;}
  .gh-day .n{width:32px; height:32px; font-size:16px;}
  .gh-day .w{font-size:11px;}
  .gh.single .gh-day .n{width:36px; height:36px; font-size:18px;}
  .ev{padding:3px 5px 3px 4px; border-radius:7px; border-inline-start-width:2.5px;}
  .ev b{font-size:12px;}
  .ev small{font-size:11px;}
  .week7 .ev{padding:2px 3px;}
  .week7 .ev b{font-size:10.5px; white-space:normal; overflow-wrap:anywhere; line-height:1.15;}
  .week7 .ev small, .week7 .ev .tag{display:none;}
  .mcell{padding:2px 1px;}
  .mnum{min-width:24px; height:24px; font-size:12px; align-self:center;}
  .mchip{font-size:10.5px; padding:1px 3px; gap:3px; border-radius:4px;}
  .mchip small{display:none;}
  .mchip i{width:5px; height:5px;}
  .mmore{font-size:10px; text-align:center; padding:0;}
  .toasts{bottom:calc(92px + var(--sab));}
  .modal{place-items:end stretch; padding:0;}
  .mcard{width:100%; max-height:92dvh; border-radius:24px 24px 0 0; transform:translateY(100%); opacity:1; transition:transform .28s var(--ease); padding-bottom:var(--sab);}
  .grab{display:block; width:40px; height:5px; border-radius:9px; background:var(--line2); margin:8px auto 0;}
  .m-top{padding-top:4px;}
  .d-body{padding:0 20px 18px;}
  .f-body{padding:0 18px 16px;}
  .f-foot{position:sticky; bottom:0; background:#fff; margin:14px -18px 0; padding:12px 18px calc(12px + var(--sab)); border-top:1px solid var(--line);}
  .f-foot .hint{display:none;}
  .f-foot .btn.primary{flex:1; height:48px; font-size:16px;}
  .d-actions .btn{flex:1; height:46px;}
  .inp, .sel{height:44px; font-size:16px;}
  .inp.date{flex:1 1 100%;}
  .inp.time{flex:1 1 110px; width:auto; min-width:0;}
  .f-title{font-size:20px;}
  .nextbar{display:flex !important; align-items:center; gap:10px; margin:8px 12px 0; padding:9px 12px; border-radius:14px; background:color-mix(in srgb,var(--c) 10%, #fff); text-align:start; font-size:13.5px;}
  .nextbar i{width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; animation:pulse 2s infinite;}
  .nextbar b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .nextbar span{margin-inline-start:auto; color:color-mix(in srgb,var(--c) 60%, #000); font-weight:700; font-size:12.5px; white-space:nowrap;}
  .nextbar.hide{display:none !important;}
  .day-empty{top:calc(var(--hh) * 8.5); inset-inline:calc(var(--gutter) + 12px) 12px;}
}
@media (min-width:761px){ .nextbar{display:none !important;} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* narrow event blocks: drop the end time and place so the start time stays readable */
@container (max-width:96px){ .ev small .end, .ev small .loc{display:none;} }
.gh.single .gh-day .cnt{margin-inline-start:auto; font-size:12.5px; color:var(--muted); font-weight:500;}
#menuBtn{position:relative;}
#menuBtn.warn::after{content:""; position:absolute; top:6px; left:6px; width:8px; height:8px; border-radius:50%; background:#F59E0B; box-shadow:0 0 0 2px #fff;}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="תפריט צד">
    <div class="side-head">
      <div class="brand"><img src="icon-192.png" alt="">Event Planner</div>
      <button type="button" class="icon-btn only-m" id="sideClose" aria-label="סגירה"><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="greet" id="greet"></div>
    <button type="button" class="btn-create only-d" id="createBtn" title="אירוע חדש (N)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>אירוע חדש</button>
    <form class="quick" id="quickForm" autocomplete="off">
      <svg class="i qicon" viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H12L11 22l8.5-11.5H12L13 2z"/></svg>
      <input id="quickInput" type="text" enterkeyhint="done" placeholder="הוספה מהירה: חדר כושר מחר 18:00" aria-label="הוספה מהירה">
      <kbd class="qhint">Enter</kbd>
      <div class="qprev" id="quickPreview" aria-live="polite"></div>
    </form>
    <section id="mini" aria-label="לוח חודשי"></section>
    <section id="upcoming" aria-label="קרובים"></section>
    <section id="filters" aria-label="סינון"></section>
    <div class="gconn" id="gconn"></div>
  </aside>

  <main class="main">
    <header class="top">
      <button type="button" class="icon-btn only-m" id="menuBtn" aria-label="תפריט"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button type="button" class="btn-today" id="todayBtn" title="חזרה להיום (T)">היום</button>
      <div class="navs">
        <button type="button" class="icon-btn" id="prevBtn" aria-label="הקודם" title="הקודם (J)"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" class="icon-btn" id="nextBtn" aria-label="הבא" title="הבא (K)"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
      <h1 class="range-title" id="rangeTitle"></h1>
      <div class="spacer only-d"></div>
      <div class="search" id="searchWrap">
        <svg class="i sicon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="חיפוש אירועים" aria-label="חיפוש אירועים" autocomplete="off" enterkeyhint="search">
        <div class="spanel" id="searchPanel" role="listbox"></div>
      </div>
      <div class="seg" id="viewSeg" role="tablist" aria-label="תצוגה">
        <button type="button" data-view="day" title="יום (D)">יום</button>
        <button type="button" data-view="week" title="שבוע (W)">שבוע</button>
        <button type="button" data-view="month" title="חודש (M)">חודש</button>
      </div>

<script>
'use strict';
/* =====================================================================
   Event Planner — calendar app (local calendar + Google Calendar)
   ===================================================================== */

/* ---------- categories (colors are soft accents, text uses a darker mix) ---------- */
const CATS = [
  {k:'friends', e:'🎉', l:'יציאה עם חברים', c:'#F59E0B', words:['חברים','יציאה','friends','hangout']},
  {k:'bar',     e:'🍻', l:'ברים / מסיבות', c:'#EC4899', words:['בר','מסיבה','פאב','שתייה','bar','party','pub','drinks']},
  {k:'beach',   e:'🏖️', l:'ים / בריכה',    c:'#06B6D4', words:['ים','בריכה','חוף','beach','pool','swim']},
  {k:'dance',   e:'💃', l:'סלסה / ריקודים', c:'#D946EF', words:['סלסה','ריקוד','ריקודים','באצ׳טה','באצטה','דאנס','salsa','dance','bachata']},
  {k:'gym',     e:'🏋️', l:'חדר כושר',      c:'#10B981', words:['כושר','ג׳ים','גים','אימון','חדר כושר','ריצה','gym','workout','training','run','yoga']},
  {k:'trip',    e:'✈️', l:'טיולים',        c:'#0EA5E9', words:['טיול','טיסה','נסיעה','חופשה','trip','flight','vacation','travel','hike']},
  {k:'games',   e:'🎮', l:'משחקים',        c:'#8B5CF6', words:['משחק','גיימינג','פלייסטיישן','משחקים','game','games','gaming']},
  {k:'movie',   e:'🎬', l:'סרטים / בידור', c:'#EF4444', words:['סרט','קולנוע','הופעה','מופע','movie','cinema','show','concert']},
  {k:'family',  e:'👨‍👩‍👦', l:'משפחה',         c:'#F97316', words:['משפחה','הורים','סבתא','סבא','אמא','אבא','family','mom','dad']},
  {k:'date',    e:'❤️', l:'דייטים',        c:'#F43F5E', words:['דייט','רומנטי','date','dinner date']},
  {k:'study',   e:'📚', l:'לימודים',       c:'#6366F1', words:['לימוד','שיעור','בחינה','מבחן','קורס','הרצאה','study','class','exam','lecture','course']},
  {k:'work',    e:'💼', l:'עבודה',         c:'#3B82F6', words:['עבודה','פגישה','ישיבה','פגישת','ישיבת','מייל','work','meeting','call','sync']},
  {k:'other',   e:'📌', l:'אחר',           c:'#64748B', words:[]}
];
const catObj = k => CATS.find(c=>c.k===k) || CATS[CATS.length-1];
// Google Calendar event colors (colorId → hex)
const GCOLORS = {1:'#7986CB',2:'#33B679',3:'#8E24AA',4:'#E67C73',5:'#F6BF26',6:'#F4511E',7:'#039BE5',8:'#616161',9:'#3F51B5',10:'#0B8043',11:'#D50000'};

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MONTHS_SHORT = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];

/* ---------- small utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
function sod(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d.getFullYear(), d.getMonth()+n, 1); return x; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function hm(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function weekStart(d){ return addDays(sod(d), -sod(d).getDay()); }
function minutesOf(d){ return d.getHours()*60 + d.getMinutes(); }
function todayLocal(){ return sod(new Date()); }
const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:JSON.parse(v); }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  rawSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function dayLabel(d){
  const t=todayLocal(), diff=Math.round((sod(d)-t)/DAY);
  if(diff===0) return 'היום';
  if(diff===1) return 'מחר';
  if(diff===-1) return 'אתמול';
  return `יום ${DAYS[d.getDay()]}`;
}
function longDate(d){ return `${d.getDate()} ב${MONTHS[d.getMonth()]}`; }
function timeRange(ev){
  if(ev.allDay){
    const last = addDays(ev.end,-1);
    return sameDay(ev.start,last) ? 'כל היום' : `${longDate(ev.start)} – ${longDate(last)}`;
  }
  if(sameDay(ev.start, ev.end) || (minutesOf(ev.end)===0 && sameDay(ev.start, addDays(ev.end,-1))))
    return `${hm(ev.start)} – ${hm(ev.end)}`;
  return `${hm(ev.start)} – ${longDate(ev.end)}, ${hm(ev.end)}`;
}
// "בעוד 25 דק׳" / "בעוד שעתיים" / "מחר ב-18:00" …
function countdown(ev, now){
  now = now || new Date();
  if(ev.start<=now && ev.end>now) return 'מתרחש עכשיו';
  const mins = Math.round((ev.start-now)/60000);
  if(mins<1) return 'מתחיל עכשיו';
  if(mins<60) return `בעוד ${mins} דק׳`;
  const days = Math.round((sod(ev.start)-sod(now))/DAY);
  if(days===0){
    const h=Math.floor(mins/60), m=mins%60;
    const hs = h===1?'שעה':h===2?'שעתיים':`${h} שעות`;
    return m>=10 ? `בעוד ${hs} ו-${m} דק׳` : `בעוד ${hs}`;
  }
  if(days===1) return ev.allDay ? 'מחר' : `מחר ב-${hm(ev.start)}`;
  if(days<7) return `בעוד ${days} ימים`;
  return `בעוד ${Math.round(days/7)===1?'שבוע':Math.round(days/7)+' שבועות'}`;
}

/* =====================================================================
   Natural-language parser (Hebrew + basic English)
   "סרט בקניון גי ביום חמישי 20:00", "Gym tomorrow 18:00", "ארוחה עם אמא מחר בערב"
   ===================================================================== */
const TIME_OF_DAY = [
  ['אחר הצהריים',{h:16,m:0}], ['הערב',{h:20,m:0}], ['הלילה',{h:22,m:0}], ['בבוקר',{h:9,m:0}], ['בצהריים',{h:13,m:0}], ['בערב',{h:19,m:0}], ['בלילה',{h:22,m:0}],
  ['morning',{h:9,m:0}], ['noon',{h:12,m:0}], ['afternoon',{h:16,m:0}], ['evening',{h:19,m:0}], ['tonight',{h:20,m:0}], ['night',{h:22,m:0}]
];
const HE_PREFIXES = ['ב','ל','מ','ו','ה','כ','ש'];
const EN_DAYS = [['sunday','sun'],['monday','mon'],['tuesday','tue','tues'],['wednesday','wed'],['thursday','thu','thur','thurs'],['friday','fri'],['saturday','sat']];
const HEB = '[א-ת׳״]';

function tokenCandidates(token){
  const forms = new Set([token]);
  if(token.length>1 && HE_PREFIXES.includes(token[0])){
    forms.add(token.slice(1));
    if(token.length>2 && HE_PREFIXES.includes(token[1])) forms.add(token.slice(2));
  }
  return forms;
}
function detectCategory(text){
  const lower = text.toLowerCase();
  const tokens = lower.split(/[^א-תa-z׳']+/).filter(Boolean);
  const allForms = new Set();
  tokens.forEach(t=>tokenCandidates(t).forEach(f=>allForms.add(f)));
  const has = w => w.includes(' ') ? lower.includes(w) : allForms.has(w);
  for(const c of CATS){
    if(c.k==='other' || c.k==='friends') continue;
    if(c.words.some(has)) return c;
  }
  const friends = catObj('friends');
  if(friends.words.some(has)) return friends;
  return catObj('other');
}

function detectDateRange(text){
  const today = todayLocal();
  const lower = text.toLowerCase();
  const dateRegex = /(?<![\d:])(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?![\d:])/g;
  const matches = [...text.matchAll(dateRegex)].filter(m=>+m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31);
  function toDate(m){
    const day=+m[1], month=+m[2]-1;
    let year = m[3] ? (m[3].length===2 ? 2000 + +m[3] : +m[3]) : today.getFullYear();
    let d = new Date(year, month, day);
    if(!m[3] && d < addDays(today,-60)) d = new Date(year+1, month, day);   // "5/1" in December means next January
    return d;
  }
  if(matches.length>=2) return {start: toDate(matches[0]), end: toDate(matches[1]), strs:[matches[0][0], matches[1][0]], multiDay:true, found:true};
  if(matches.length===1) return {start: toDate(matches[0]), end:null, strs:[matches[0][0]], multiDay:false, found:true};
  const word = (re) => text.match(re);
  let m;
  if((m=word(new RegExp(`(?<!${HEB})(?:ב|ל)?מחרתיים(?!${HEB})`)))) return {start:addDays(today,2), end:null, strs:[m[0]], multiDay:false, found:true};
  if((m=word(new RegExp(`(?<!${HEB})(?:ל)?מחר(?!${HEB})`)))) return {start:addDays(today,1), end:null, strs:[m[0]], multiDay:false, found:true};
  if((m=word(new RegExp(`(?<!${HEB})(?:ה|ל)?היום(?!${HEB})`)))) return {start:today, end:null, strs:[m[0]], multiDay:false, found:true};
  if((m=lower.match(/\bday after tomorrow\b/))) return {start:addDays(today,2), end:null, strs:[text.substr(m.index,m[0].length)], multiDay:false, found:true};
  if((m=lower.match(/\btomorrow\b|\btmrw\b/))) return {start:addDays(today,1), end:null, strs:[text.substr(m.index,m[0].length)], multiDay:false, found:true};
  if((m=lower.match(/\btoday\b|\btonight\b/))){ const s=text.substr(m.index,m[0].length); return {start:today, end:null, strs: /tonight/i.test(s)?[]:[s], multiDay:false, found:true}; }
  const isNext = /הבא|הבאה|\bnext\b/i.test(text);
  for(let i=0;i<DAYS.length;i++){
    const dm = text.match(new RegExp(`(?<!${HEB})(?:ב|ל)?(?:יום\\s*)?${DAYS[i]}(?!${HEB})`));
    const en = lower.match(new RegExp(`\\b(?:next\\s+|on\\s+)?(?:${EN_DAYS[i].join('|')})\\b`));
    const hit = dm ? dm[0] : en ? text.substr(en.index, en[0].length) : null;
    if(hit){
      let diff = (i - today.getDay() + 7) % 7;
      if(diff===0 && isNext) diff = 7;
      return {start:addDays(today,diff), end:null, strs:[hit], multiDay:false, found:true};
    }
  }
  return {start: today, end:null, strs:[], multiDay:false, found:false};
}

function timeToParts(str){
  const half = str.includes('וחצי');
  const m = str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/i);
  if(!m) return null;
  let h = +m[1], mi = m[2] ? +m[2] : (half ? 30 : 0);
  const ap = m[3] && m[3].toLowerCase()[0];
  if(ap==='p' && h<12) h+=12;
  if(ap==='a' && h===12) h=0;
  if(h>24 || mi>59) return null;
  return {h: h%24, m: mi};
}
const T = '(\\d{1,2}(?::\\d{2})?(?:\\s*(?:וחצי|am|pm|a\\.m\\.|p\\.m\\.))?)';
function detectLabeledTimes(text){
  const sM = text.match(/התחלה[^0-9]{0,6}(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)/);
  const eM = text.match(/סיום[^0-9]{0,6}(\d{1,2}(?::\d{2})?(?:\s*וחצי)?)/);
  if(sM && eM) return {start: timeToParts(sM[1]), end: timeToParts(eM[1]), strs:[sM[0], eM[0]]};
  return null;
}
function detectTimes(text){
  // ranges: "20:00-22:00", "בין 8 ל-10", "מ-18 עד 20", "6pm-8pm"
  let m = text.match(new RegExp(`(?:בין|מ-?|משעה|from)?\\s*${T}\\s*(?:-|–|עד|ל-?|to|until)\\s*${T}`, 'i'));
  if(m && (/[:]|am|pm|וחצי/i.test(m[0]) || /בין|מ-?|משעה|from/.test(m[0]))){
    const s=timeToParts(m[1]), e=timeToParts(m[2]);
    if(s&&e) return {start:s, end:e, strs:[m[0]]};
  }
  // single: "ב-20:00", "בשעה 8", "at 6pm", "18:00", "6pm"
  m = text.match(new RegExp(`(?:ב-?|בשעה\\s*|at\\s+|@\\s*)${T}`, 'i'));
  if(m && !/^\s*ב-?\d{1,2}[./]/.test(m[0])){ const s=timeToParts(m[1]); if(s) return {start:s, end:null, strs:[m[0]]}; }
  m = text.match(/(?<![\d./])(\d{1,2}:\d{2}|\d{1,2}\s*(?:am|pm))(?![\d./])/i);
  if(m){ const s=timeToParts(m[1]); if(s) return {start:s, end:null, strs:[m[0]]}; }
  return {start:null, end:null, strs:[]};
}
function stripStrings(text, strs){
  let t = text;
  (strs||[]).forEach(s=>{ if(s) t = t.replace(s,' '); });
  return t;
}
function cleanConnectors(text){
  const stop = new Set(['בין','מ-','משעה','עד','ל-','היום','מחר','מחרתיים','הבא','הבאה','ב-','בשעה','התחלה','סיום','-','–',
    'at','on','from','to','next','the','this']);
  return text.split(/\s+/).filter(w=>w && !stop.has(w.toLowerCase())).join(' ').trim();
}
const CATEGORY_WORDS = new Set(CATS.flatMap(c=>c.words));
// Splits the leftover text into {title, location}. A 'ב'-prefixed word (not the first one and not a
// category word) starts a location: "סרט בקניון גי" → title "סרט", location "קניון גי". "@ place" works too.
function splitLocation(text){
  const at = text.match(/\s@\s*(.+)$/);
  if(at) return {title:text.slice(0,at.index).trim(), location:at[1].trim()};
  const words = text.split(/\s+/).filter(Boolean);
  for(let i=1;i<words.length;i++){
    const w = words[i];
    if(w[0]==='ב' && w.length>2 && !CATEGORY_WORDS.has(w) && !CATEGORY_WORDS.has(w.slice(1)) && !['בלי','בשביל','ביחד','בערך','בית'].includes(w)){
      const title = words.slice(0,i).join(' ').trim();
      const location = (w.slice(1) + ' ' + words.slice(i+1).join(' ')).trim();
      if(title) return {title, location};
    }
  }
  return {title: words.join(' ').trim(), location:''};
}

// Returns everything the text says, plus which parts were actually found (so a form only overrides those).
function parseEvent(raw, base){
  raw = (raw||'').trim();
  const cat = detectCategory(raw);
  const dr = detectDateRange(raw);
  const labeled = detectLabeledTimes(raw);
  let times = labeled || detectTimes(raw);
  let timeStrs = (times.strs||[]).slice();
  if(!times.start){
    for(const [w,t] of TIME_OF_DAY){
      const re = /^[a-z]/.test(w) ? new RegExp(`\\b${w}\\b`,'i') : new RegExp(`(?<!${HEB})${w}(?!${HEB})`);
      const mm = raw.match(re);
      if(mm){ times = {start:t, end:null}; timeStrs.push(mm[0]); break; }
    }
  }
  let clean = stripStrings(raw, dr.strs);
  clean = stripStrings(clean, timeStrs);
  clean = cleanConnectors(clean);
  const {title, location} = splitLocation(clean);

  const b = base || {};
  const startH = times.start ? times.start.h : (b.h!=null ? b.h : 19);
  const startM = times.start ? times.start.m : (b.m!=null ? b.m : 0);
  const durMin = b.dur || 60;
  const startDate = new Date(dr.found ? dr.start : (b.date || dr.start));
  startDate.setHours(startH, startM, 0, 0);
  let endDate;
  if(times.end){
    const endBase = (dr.multiDay && dr.end) ? dr.end : startDate;
    endDate = new Date(endBase); endDate.setHours(times.end.h, times.end.m, 0, 0);
  } else if(dr.multiDay && dr.end){
    endDate = new Date(dr.end); endDate.setHours(startH, startM, 0, 0); endDate = new Date(endDate.getTime()+durMin*60000);
  } else {
    endDate = new Date(startDate.getTime() + durMin*60000);
  }
  let overnight = false;
  if(endDate <= startDate){ endDate = addDays(endDate,1); overnight = true; }
  // "טיול 12/10 עד 14/10" with no hours → an all-day event over those days
  const allDay = !!(dr.multiDay && dr.end && !times.start);
  if(allDay){ const s=sod(dr.start), e=addDays(sod(dr.end),1); return {
    title, location, cat: cat.k, catFound: cat.k!=='other', start:s, end:e>s?e:addDays(s,1), allDay:true,
    overnight:false, multiDay:true, dateFound:true, timeFound:false }; }
  return {
    title: title, location, cat: cat.k, catFound: cat.k!=='other', allDay:false,
    start: startDate, end: endDate, overnight, multiDay: !sameDay(startDate, new Date(endDate.getTime()-1)),
    dateFound: dr.found, timeFound: !!times.start
  };
}

/* =====================================================================
   Data: a local calendar ("on this device") + Google Calendar
   Every event is normalized to:
   {key, id, src:'local'|'google', calId, title, start, end, allDay, location, notes, cat, colorId, recurring, pending}
   All-day events use an exclusive end (like Google): a one-day event ends at next midnight.
   ===================================================================== */
const LOCAL_CAL = {id:'local', summary:'במכשיר הזה', color:'#5B5BD6', writable:true, local:true};

const S = {
  view: LS.raw('ep_view') || (matchMedia('(max-width: 760px)').matches ? 'day' : 'week'),
  date: todayLocal(),
  local: [],
  gCals: LS.get('ep_gcals', []),            // cached calendar list (instant paint on reload)
  gWin: null, gEvents: [],                   // events of the loaded window
  gUpcoming: [],                             // today → +14 days (for "Upcoming", independent of the window)
  gState: 'off',                             // off | connecting | syncing | ok | error | expired
  gSyncedAt: 0,
  hiddenCals: new Set(LS.get('ep_hidden_cals', [])),
  hiddenCats: new Set(LS.get('ep_hidden_cats', [])),
  flashKey: null,
  firstLoad: true
};

/* ---------- local calendar ---------- */
function loadLocal(){
  const rows = LS.get('ep_local_events', []);
  S.local = rows.map(r=>({...r, key:'l:'+r.id, src:'local', calId:'local', start:new Date(r.start), end:new Date(r.end)}))
    .filter(e=>!isNaN(e.start) && !isNaN(e.end));
}
function saveLocal(){
  LS.set('ep_local_events', S.local.map(e=>({id:e.id, title:e.title, start:e.start.toISOString(), end:e.end.toISOString(),
    allDay:!!e.allDay, location:e.location||'', notes:e.notes||'', cat:e.cat})));
}

/* ---------- Google Calendar (in-page OAuth, no redirect) ---------- */
const G_SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly';
const G_API = 'https://www.googleapis.com/calendar/v3';
let tokenClient = null;
let accessToken = null, tokenExp = 0;
(function restoreToken(){
  const t = LS.get('gcal_token', null);
  if(t && t.exp > Date.now()+60e3){ accessToken = t.t; tokenExp = t.exp; }
})();
function getClientId(){ return LS.raw('gcal_client_id') || ''; }
function gConnected(){ return LS.raw('gcal_connected')==='1'; }
function tokenValid(){ return !!accessToken && tokenExp > Date.now()+30e3; }
function initGIS(){
  const cid = getClientId();
  if(!cid || !window.google || !google.accounts || !google.accounts.oauth2) return false;
  if(tokenClient && tokenClient._cid===cid) return true;
  tokenClient = google.accounts.oauth2.initTokenClient({client_id:cid, scope:G_SCOPES, callback:()=>{}});
  tokenClient._cid = cid;
  return true;
}
// Must be called directly from a click (the Google popup needs a user gesture).
function ensureToken(forceConsent){
  return new Promise((resolve, reject)=>{
    if(tokenValid()){ resolve(accessToken); return; }
    if(!getClientId()){ reject({code:'no-client-id'}); return; }
    if(!initGIS()){ reject({code:'gis-not-ready'}); return; }
    tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      accessToken = resp.access_token;
      tokenExp = Date.now() + (Number(resp.expires_in)||3600)*1000;
      LS.set('gcal_token', {t:accessToken, exp:tokenExp});
      LS.rawSet('gcal_connected','1');
      resolve(accessToken);
    };
    tokenClient.error_callback = (err)=>reject(err||{code:'popup'});
    tokenClient.requestAccessToken({prompt: forceConsent ? 'consent' : (gConnected() ? '' : 'consent')});
  });
}
function disconnectGoogle(){
  try{ if(accessToken && window.google && google.accounts) google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
  accessToken=null; tokenExp=0;
  try{ ['gcal_token','gcal_connected','ep_gcals','ep_gcache'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  S.gCals=[]; S.gEvents=[]; S.gUpcoming=[]; S.gWin=null; S.gState='off';
}
async function gFetch(path, opts){
  if(!tokenValid()){ const e=new Error('token'); e.code='expired'; throw e; }
  const res = await fetch(G_API+path, {...(opts||{}), headers:{'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json', ...((opts&&opts.headers)||{})}});
  if(res.status===401){ accessToken=null; tokenExp=0; const e=new Error('401'); e.code='expired'; throw e; }
  if(!res.ok){ const e=new Error('http '+res.status); e.status=res.status; try{ e.body=await res.json(); }catch(_){} throw e; }
  return res.status===204 ? null : res.json();
}
async function gLoadCalendars(){
  try{
    const r = await gFetch('/users/me/calendarList?minAccessRole=reader&maxResults=250');
    S.gCals = (r.items||[]).filter(c=>!c.deleted && !c.hidden).map(c=>({
      id:c.id, summary:c.summaryOverride||c.summary, color:c.backgroundColor||'#039BE5',
      primary:!!c.primary, writable: c.accessRole==='owner'||c.accessRole==='writer'
    })).sort((a,b)=>(b.primary-a.primary) || (b.writable-a.writable) || a.summary.localeCompare(b.summary,'he'));
  }catch(e){
    if(e.code==='expired') throw e;
    // calendar list not allowed (older consent) → just the primary calendar
    S.gCals = [{id:'primary', summary:'Google Calendar', color:'#039BE5', primary:true, writable:true}];
  }
  LS.set('ep_gcals', S.gCals);
}
function htmlToText(s){
  if(!s || !/[<&]/.test(s)) return s||'';
  try{ return new DOMParser().parseFromString(s.replace(/<br\s*\/?>/gi,'\n'), 'text/html').body.textContent || ''; }catch(e){ return s; }
}
function fromGoogle(it, cal){
  const allDay = !!(it.start && it.start.date);
  const start = allDay ? parseYMD(it.start.date) : new Date(it.start.dateTime);
  const end = allDay ? parseYMD(it.end.date) : new Date(it.end.dateTime);
  const priv = (it.extendedProperties && it.extendedProperties.private) || {};
  let notes = htmlToText(it.description||'').trim(), cat = priv.epCat && CATS.some(c=>c.k===priv.epCat) ? priv.epCat : null;
  for(const c of CATS){                                      // our own "emoji label — notes" prefix
    const pre = `${c.e} ${c.l}`;
    if(notes.startsWith(pre)){ cat = cat || c.k; notes = notes.slice(pre.length).replace(/^\s*—\s*/,''); break; }
  }
  if(!cat) cat = detectCategory(it.summary||'').k;
  return {key:`g:${cal.id}:${it.id}`, id:it.id, src:'google', calId:cal.id, title:it.summary||'(ללא כותרת)', start, end, allDay,
    location:it.location||'', notes, cat, colorId:it.colorId||null, recurring:!!it.recurringEventId, link:it.htmlLink||''};
}
async function gListEvents(cal, from, to, q){
  let out=[], pageToken='';
  for(let i=0;i<5;i++){
    const p = new URLSearchParams({timeMin:from.toISOString(), timeMax:to.toISOString(), singleEvents:'true', orderBy:'startTime', maxResults:'250',
      fields:'nextPageToken,items(id,status,summary,description,location,start,end,colorId,recurringEventId,extendedProperties,htmlLink)'});
    if(q) p.set('q', q);
    if(pageToken) p.set('pageToken', pageToken);
    const r = await gFetch(`/calendars/${encodeURIComponent(cal.id)}/events?`+p.toString());
    out = out.concat((r.items||[]).filter(it=>it.status!=='cancelled' && it.start).map(it=>fromGoogle(it, cal)));
    if(!r.nextPageToken || q) break;
    pageToken = r.nextPageToken;
  }
  return out;
}
function windowFor(d){ return {from: addDays(addMonths(d,-1), -7), to: addDays(addMonths(d,2), 7)}; }
function inWindow(w, from, to){ return w && from>=w.from && to<=w.to; }

let syncSeq = 0;
// Silent sync: no messages, just a thin progress line. Called on start, on navigation outside the window, every few minutes.
async function syncGoogle(force){
  if(!gConnected() || !getClientId()) { S.gState='off'; return; }
  if(!tokenValid()){ S.gState='expired'; renderSide(); return; }
  const [rs, re] = viewRange();
  if(!force && inWindow(S.gWin, rs, re) && Date.now()-S.gSyncedAt < 5*60e3) return;
  const seq = ++syncSeq;
  const win = (!force && inWindow(S.gWin, rs, re)) ? S.gWin : windowFor(S.date);
  S.gState = 'syncing'; setBusy(true);
  try{
    if(!S.gCals.length || force) await gLoadCalendars();
    const cals = S.gCals;
    const t0 = todayLocal();
    const [lists, ups] = await Promise.all([
      Promise.all(cals.map(c=>gListEvents(c, win.from, win.to).catch(e=>{ if(e.code==='expired') throw e; return []; }))),
      Promise.all(cals.map(c=>gListEvents(c, t0, addDays(t0,15)).catch(e=>{ if(e.code==='expired') throw e; return []; })))
    ]);
    if(seq!==syncSeq) return;
    S.gWin = win; S.gEvents = lists.flat(); S.gUpcoming = ups.flat();
    S.gState = 'ok'; S.gSyncedAt = Date.now();
    saveGCache();
  }catch(e){
    if(seq!==syncSeq) return;
    S.gState = e.code==='expired' ? 'expired' : 'error';
  }finally{
    if(seq===syncSeq){ setBusy(false); S.firstLoad=false; renderAll(); }
  }
}

// Last synced Google events are kept on the device, so a reload paints the real calendar instantly
// (and still shows it if the Google session needs a fresh sign-in).
function packEv(e){ return {...e, start:e.start.toISOString(), end:e.end.toISOString()}; }
function unpackEv(e){ return {...e, start:new Date(e.start), end:new Date(e.end)}; }
function saveGCache(){
  try{ LS.set('ep_gcache', {win:{from:S.gWin.from.toISOString(), to:S.gWin.to.toISOString()}, ev:S.gEvents.map(packEv), up:S.gUpcoming.map(packEv), at:S.gSyncedAt}); }catch(e){}
}
function loadGCache(){
  if(!gConnected()) return;
  const c = LS.get('ep_gcache', null); if(!c || !c.ev) return;
  try{
    S.gEvents = c.ev.map(unpackEv); S.gUpcoming = (c.up||[]).map(unpackEv);
    S.gSyncedAt = c.at || 0;
    S.gWin = null;                        // treat as stale: the next sync refreshes it
  }catch(e){ S.gEvents=[]; S.gUpcoming=[]; }
}

/* ---------- merged view of all events ---------- */
function allEvents(){
  const map = new Map();
  S.local.forEach(e=>map.set(e.key,e));
  S.gUpcoming.forEach(e=>map.set(e.key,e));
  S.gEvents.forEach(e=>map.set(e.key,e));
  pendingEvents.forEach(e=>map.set(e.key,e));
  return [...map.values()];
}
function isVisible(e){ return !S.hiddenCals.has(e.calId) && !S.hiddenCats.has(e.cat); }
function eventsBetween(from, to){
  return allEvents().filter(e=>isVisible(e) && e.start<to && e.end>from)
    .sort((a,b)=>a.start-b.start || (b.end-b.start)-(a.end-a.start));
}
function calById(id){ return id==='local' ? LOCAL_CAL : (S.gCals.find(c=>c.id===id) || {id, summary:'Google Calendar', color:'#039BE5', writable:true}); }
function writableCals(){ return [...(tokenValid()||gConnected() ? S.gCals.filter(c=>c.writable) : []), LOCAL_CAL]; }
function evColor(e){
  if(e.colorId && GCOLORS[e.colorId]) return GCOLORS[e.colorId];
  if(e.cat && e.cat!=='other') return catObj(e.cat).c;
  return e.src==='google' ? calById(e.calId).color : LOCAL_CAL.color;
}
function nextEvent(now){
  now = now || new Date();
  const soon = eventsBetween(now, addDays(now, 14)).filter(e=>!e.allDay && !e.pending);
  return soon.find(e=>e.start<=now && e.end>now) || soon.find(e=>e.start>now) || null;
}

/* ---------- create / update / delete (optimistic) ---------- */
const pendingEvents = new Map();   // key → temp event shown while Google saves
function toGoogleBody(d){
  const c = catObj(d.cat), tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const body = {
    summary: d.title, location: d.location || '',
    description: `${c.e} ${c.l}${d.notes ? ' — ' + d.notes : ''}`,
    extendedProperties: {private: {epCat: d.cat}}
  };
  const rfc = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}:00`;
  if(d.allDay){ body.start={date:ymd(d.start)}; body.end={date:ymd(d.end)}; }
  else { body.start={dateTime:rfc(d.start), timeZone:tz}; body.end={dateTime:rfc(d.end), timeZone:tz}; }
  return body;
}
function upsertCache(ev){
  ['gEvents','gUpcoming'].forEach(k=>{ S[k] = S[k].filter(x=>x.key!==ev.key); });
  if(inWindow(S.gWin, ev.start, ev.start)) S.gEvents.push(ev);
  const t0=todayLocal(); if(ev.end>t0 && ev.start<addDays(t0,15)) S.gUpcoming.push(ev);
}
function dropCache(key){ ['gEvents','gUpcoming'].forEach(k=>{ S[k] = S[k].filter(x=>x.key!==key); }); }

// d: {title,start,end,allDay,location,notes,cat,calId}; tokenP: promise from ensureToken() started inside the click
async function createEvent(d, tokenP){
  if(d.calId==='local'){
    const ev = {...d, id:uid(), src:'local', calId:'local'}; ev.key='l:'+ev.id;
    S.local.push(ev); saveLocal(); return ev;
  }
  const tmp = {...d, id:'tmp'+uid(), src:'google', pending:true}; tmp.key='p:'+tmp.id;
  pendingEvents.set(tmp.key, tmp); renderAll();
  try{
    if(tokenP) await tokenP;
    const cal = calById(d.calId);
    const it = await gFetch(`/calendars/${encodeURIComponent(cal.id)}/events`, {method:'POST', body:JSON.stringify(toGoogleBody(d))});
    const ev = fromGoogle(it, cal); upsertCache(ev); return ev;
  } finally { pendingEvents.delete(tmp.key); }
}
async function updateEvent(old, d, tokenP){
  if(old.src==='local' && d.calId==='local'){
    const ev = S.local.find(x=>x.key===old.key); Object.assign(ev, d); saveLocal(); return ev;
  }
  if(old.calId!==d.calId){                       // moved to another calendar: create there, then remove the old one
    const ev = await createEvent(d, tokenP);
    await deleteEvent(old).catch(()=>{});
    return ev;
  }
  if(tokenP) await tokenP;
  const cal = calById(old.calId);
  const it = await gFetch(`/calendars/${encodeURIComponent(cal.id)}/events/${encodeURIComponent(old.id)}`, {method:'PATCH', body:JSON.stringify(toGoogleBody(d))});
  const ev = fromGoogle(it, cal); upsertCache(ev); return ev;
}
async function deleteEvent(ev, tokenP){
  if(ev.src==='local'){ S.local = S.local.filter(x=>x.key!==ev.key); saveLocal(); return; }
  if(tokenP) await tokenP;
  await gFetch(`/calendars/${encodeURIComponent(ev.calId)}/events/${encodeURIComponent(ev.id)}`, {method:'DELETE'});
  dropCache(ev.key);
}

const isMobile = () => matchMedia('(max-width: 760px)').matches;
const hhPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh')) || 52;

/* ---------- range of the current view ---------- */
function monthGridStart(d){ return weekStart(new Date(d.getFullYear(), d.getMonth(), 1)); }
function monthRows(d){
  const first = new Date(d.getFullYear(), d.getMonth(), 1), days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return Math.ceil((first.getDay() + days)/7);
}
function viewRange(){
  if(S.view==='day') return [S.date, addDays(S.date,1)];
  if(S.view==='week'){ const s=weekStart(S.date); return [s, addDays(s,7)]; }
  const s = monthGridStart(S.date); return [s, addDays(s, monthRows(S.date)*7)];
}
function viewDays(){
  if(S.view==='day') return [S.date];
  const s = weekStart(S.date); return Array.from({length:7},(_,i)=>addDays(s,i));
}

/* ---------- top bar ---------- */
function renderTop(){
  const d = S.date, yr = d.getFullYear()!==new Date().getFullYear();
  let html;
  if(S.view==='day'){
    html = isMobile() ? `${d.getDate()} ב${MONTHS[d.getMonth()]}${yr?' '+d.getFullYear():''}`
      : `יום ${DAYS[d.getDay()]}, ${longDate(d)}<small>${d.getFullYear()}</small>`;
  } else if(S.view==='week'){
    const s = weekStart(d), e = addDays(s,6);
    html = s.getMonth()===e.getMonth() ? `${MONTHS[s.getMonth()]}<small>${s.getFullYear()}</small>`
      : `${MONTHS_SHORT[s.getMonth()]} – ${MONTHS_SHORT[e.getMonth()]}<small>${e.getFullYear()}</small>`;
    if(isMobile()) html = s.getMonth()===e.getMonth() ? `${MONTHS[s.getMonth()]}${yr?' '+s.getFullYear():''}` : `${MONTHS_SHORT[s.getMonth()]} – ${MONTHS_SHORT[e.getMonth()]}`;
  } else {
    html = `${MONTHS[d.getMonth()]}<small>${d.getFullYear()}</small>`;
    if(isMobile()) html = `${MONTHS[d.getMonth()]}${yr?' '+d.getFullYear():''}`;
  }

  const [rs,re] = viewRange(), now = new Date();
  const tb = $('#todayBtn');
